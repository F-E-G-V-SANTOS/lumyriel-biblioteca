(()=>{'use strict';const PATH='books/lmy-nmv-b1.dat',q=new URLSearchParams(location.search),inner=document.getElementById('inner'),list=document.getElementById('chapters'),paper=document.getElementById('paper'),shell=document.getElementById('shell');let data,chapters=[],index=0;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function decode(){const r=await fetch(PATH,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const t=(await r.text()).replace(/\s+/g,''),b=atob(t),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);const stream=new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'));return JSON.parse(await new Response(stream).text())}function blocks(text){return String(text||'').split(/\n{2,}/).map(x=>x.trim()).filter(Boolean).map(x=>x.startsWith('## ')?'<h3>'+esc(x.slice(3))+'</h3>':'<p>'+esc(x).replace(/\n/g,'<br>')+'</p>').join('')}function renderList(){list.innerHTML='';chapters.forEach((c,i)=>{const b=document.createElement('button');b.className='chapter-btn'+(i===index?' active':'');b.innerHTML='<strong>'+esc(c.number==='0'?'Abertura':c.appendix?'Apêndice '+c.number:'Capítulo '+c.number)+'</strong><small>'+esc(c.title)+'</small>';b.onclick=()=>{index=i;render()};list.appendChild(b)})}function render(){const c=chapters[index];if(!c)return;const label=c.number==='0'?'Abertura':c.appendix?'Apêndice '+c.number:'Capítulo '+c.number;inner.innerHTML='<div class="meta"><span>'+esc(data.edition||'')+'</span><span>'+(index+1)+' de '+chapters.length+'</span></div>'+(c.part?'<div class="part">'+esc(c.part)+'</div>':'')+'<div class="kicker">'+esc(label)+'</div><h2 class="title">'+esc(c.title)+'</h2><div class="content">'+blocks(c.body)+'</div><div class="nav"><button id="prev">← Anterior</button><button id="next">Próximo →</button></div>';document.getElementById('prev').disabled=index===0;document.getElementById('next').disabled=index===chapters.length-1;document.getElementById('prev').onclick=()=>{if(index){index--;render()}};document.getElementById('next').onclick=()=>{if(index<chapters.length-1){index++;render()}};paper.scrollTop=0;renderList()}decode().then(x=>{data=x;chapters=x.chapters||[];document.getElementById('edition').textContent=x.edition||'Primeira edição';index=Math.min(Math.max(0,Number(q.get('ch')||0)),Math.max(0,chapters.length-1));if(!chapters.length)throw Error('Sem capítulos');render()}).catch(e=>{console.error(e);inner.innerHTML='<div class="loading">Não foi possível abrir esta edição agora.</div>'});document.getElementById('menuBackdrop').onclick=()=>{shell.classList.remove('menu-open');document.getElementById('menuBtn').setAttribute('aria-expanded','false')};document.getElementById('bookSelector').onchange=e=>{const routes={narrar:'narrar-reader.html',filho:'reader.html?book=filho&v=0&intro=1',tempos:'reader.html?book=tempos&v=0&intro=1',magia:'reader.html?book=magia&v=0&intro=1',matematica:'reader.html?book=matematica&v=0&intro=1',biologia:'biology-reader.html?v=0&mode=intro'};location.href=routes[e.target.value]}})();
