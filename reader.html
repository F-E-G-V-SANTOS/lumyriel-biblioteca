<script>
const DATA={filho:'books/lmy-odm-b13.dat',tempos:'books/lmy-olt-b1.dat',magia:'books/lmy-aml-b1.dat',matematica:'books/lmy-mfl-rc1.dat'};
const READER_CONFIG=window.LUMYRIEL_CONFIG||{},READER_CONTENT_BASE=(READER_CONFIG.readerContentBaseUrl||'').replace(/\/$/,''),READER_PROTECTION=READER_CONFIG.readerProtectionEnabled!==false;
function readerDataUrl(id){if(!READER_CONTENT_BASE)return DATA[id];return READER_CONTENT_BASE+'/books/'+encodeURIComponent(id)}
function decodeStaticBook(encoded){const clean=String(encoded||'').replace(/\s+/g,''),binary=atob(clean),bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);return JSON.parse(new TextDecoder('utf-8').decode(bytes))}
async function decodeGzipBase64(encoded){const clean=String(encoded||'').replace(/\s+/g,''),binary=atob(clean),bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);if(typeof DecompressionStream!=='function')throw new Error('Navegador sem suporte à leitura desta edição');const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));return JSON.parse(await new Response(stream).text())}
async function fetchGzipJson(path,label){const response=await fetch(path,{cache:'no-store'});if(!response.ok)throw new Error('Falha ao abrir '+label);return decodeGzipBase64(await response.text())}
function mathIntroText(obj){if(!obj)return '';for(const key of ['body','intro','text','content'])if(typeof obj[key]==='string'&&obj[key].trim())return obj[key];const out=[],skip=new Set(['schema','title','subtitle','edition','version','id','slug','file','intro_file']);function visit(node,key,root){if(node==null)return;if(typeof node==='string'){if(!skip.has(key)&&node.trim())out.push(node.trim());return}if(Array.isArray(node)){node.forEach(x=>visit(x,key,false));return}if(typeof node==='object'){if(!root&&typeof node.title==='string'&&node.title.trim())out.push('## '+node.title.trim());for(const [k,v] of Object.entries(node)){if(k==='title'||skip.has(k))continue;visit(v,k,false)}}}visit(obj,'root',true);return out.join('

')}
async function loadMathBookData(){const manifest=await fetchGzipJson(DATA.matematica,'o manifesto de Matemática e Física');const introObj=await fetchGzipJson(manifest.intro_file,'a abertura de Matemática e Física');const chapters=[];let offset=0;manifest.sections.forEach((section,sectionIndex)=>{section.start=offset;section.chapters.forEach((ch,sectionChapterIndex)=>chapters.push({...ch,sectionIndex,sectionChapterIndex,part:section.label||section.title||'',partIntro:'',sectionRoman:section.roman||'',sectionTitle:section.title||''}));offset+=section.chapters.length});return {...manifest,intro:mathIntroText(introObj),chapters,mathSectionCache:[]}}
async function ensureMathChapter(index){const meta=data.chapters[index];if(!meta)throw new Error('Leitura matemática inexistente');if(typeof meta.body==='string')return meta;const sectionMeta=data.sections[meta.sectionIndex],cache=data.mathSectionCache||(data.mathSectionCache=[]);let section=cache[meta.sectionIndex];if(!section){section=fetchGzipJson(sectionMeta.file,sectionMeta.label||sectionMeta.title||'uma seção de Matemática e Física');cache[meta.sectionIndex]=section}try{section=await section}catch(err){cache[meta.sectionIndex]=null;throw err}cache[meta.sectionIndex]=section;if(section.schema!=='lumyriel-reader-math-section-v1')throw new Error('Bloco matemático com formato inesperado');if(!Array.isArray(section.chapters)||section.chapters.length!==sectionMeta.chapters.length)throw new Error('Bloco matemático incompleto');const start=sectionMeta.start||0;section.chapters.forEach((ch,i)=>{const target=data.chapters[start+i];if(target)Object.assign(target,ch,{part:section.label||sectionMeta.label||section.title||sectionMeta.title||'',partIntro:i===0?(section.intro||''):'',sectionRoman:section.roman||sectionMeta.roman||'',sectionTitle:section.title||sectionMeta.title||''})});return data.chapters[index]}
async function loadBookData(id){if(id==='magia'){const response=await fetch(DATA.magia,{cache:'no-store'});if(!response.ok)throw new Error('Falha ao abrir Artes Mágicas');return decodeGzipBase64(await response.text())}if(id==='matematica')return loadMathBookData();const response=await fetch(readerDataUrl(id),{cache:'no-store'});if(!response.ok)throw new Error('Falha ao abrir o livro');if(READER_CONTENT_BASE)return response.json();return decodeStaticBook(await response.text())}
const q=new URLSearchParams(location.search),bookId=DATA[q.get('book')]?q.get('book'):'filho',READING_KEY='lumyriel-reading-progress-v1';
const shell=document.getElementById('shell'),paper=document.getElementById('paper'),paperInner=document.getElementById('paperInner'),chapterList=document.getElementById('chapterList'),hierarchy=document.getElementById('hierarchy'),pageCount=document.getElementById('pageCount'),progress=document.getElementById('progress'),sideCover=document.getElementById('sideCover'),bookSelector=document.getElementById('bookSelector'),readerFeedbackLink=document.getElementById('readerFeedbackLink');
const coverKey=bookId==='tempos'?'tempos':bookId==='magia'?'magia':bookId==='matematica'?'matematica':'filho';if(window.LUMYRIEL_COVERS&&window.LUMYRIEL_COVERS[coverKey])sideCover.style.backgroundImage='url("'+window.LUMYRIEL_COVERS[coverKey]+'")';
bookSelector.value=bookId;
function getReadingMemory(){try{return JSON.parse(localStorage.getItem(READING_KEY)||'{}')||{}}catch(e){return {}}}
bookSelector.addEventListener('change',()=>{const id=bookSelector.value,mem=getReadingMemory(),saved=mem[id];const fallback=id==='tempos'?'reader.html?book=tempos&note=1':id==='magia'?'reader.html?book=magia&v=0&intro=1':id==='matematica'?'reader.html?book=matematica&intro=1':'reader.html?book=filho&ch=0';location.href=saved&&saved.url?saved.url+(saved.url.includes('?')?'&':'?')+'resume=1':fallback});
let data=null,state={c:Math.max(0,Number(q.get('c')||0)),b:Math.max(0,Number(q.get('b')||0)),v:Math.max(0,Number(q.get('v')||0)),ch:Math.max(0,Number(q.get('ch')||0)),note:q.get('note')==='1',intro:q.get('intro')==='1'},resumeRequested=q.get('resume')==='1',saveTimer=null;
function currentReaderUrl(){const p=new URLSearchParams({book:bookId});if(bookId==='tempos'){p.set('c',state.c);p.set('b',state.b);p.set('ch',state.ch);if(state.note)p.set('note','1')}else if(bookId==='magia'){p.set('v',state.v);p.set('ch',state.ch);if(state.intro)p.set('intro','1')}else if(bookId==='matematica'){p.set('ch',state.ch);if(state.intro)p.set('intro','1')}else p.set('ch',state.ch);return 'reader.html?'+p.toString()}
function currentReadingLabel(){if(!data)return '';if(bookId==='tempos'){if(state.note)return 'Nota editorial';const col=data.collections[state.c],bk=col&&col.books[state.b],ch=bk&&bk.chapters[state.ch];return bk&&ch?'Livro '+bk.number+' · Capítulo '+ch.number+' · '+ch.title:''}if(bookId==='magia'){const v=data.volumes[state.v];if(!v)return '';if(state.intro)return 'Volume '+v.roman+' · Abertura';const ch=v.chapters[state.ch];return ch?'Volume '+v.roman+' · Capítulo '+ch.number+' · '+ch.title:''}if(bookId==='matematica'){if(state.intro)return 'Abertura';const ch=data.chapters[state.ch];return ch?(ch.appendix?'Apêndice ':'Capítulo ')+ch.number+' · '+ch.title:''}const ch=data.chapters[state.ch];return ch?'Capítulo '+ch.number+' · '+ch.title:''}
if(readerFeedbackLink){readerFeedbackLink.href='feedback.html?book='+encodeURIComponent(bookId);readerFeedbackLink.addEventListener('click',()=>{const p=new URLSearchParams({book:bookId}),label=currentReadingLabel();if(label)p.set('location',label);readerFeedbackLink.href='feedback.html?'+p.toString()})}
function saveReadingProgress(){if(!data)return;const max=Math.max(0,paper.scrollHeight-paper.clientHeight),ratio=max?Math.min(1,Math.max(0,paper.scrollTop/max)):0,mem=getReadingMemory();mem[bookId]={book:bookId,title:data.title||'',label:currentReadingLabel(),url:currentReaderUrl(),scrollRatio:ratio,updatedAt:Date.now()};mem.last=bookId;try{localStorage.setItem(READING_KEY,JSON.stringify(mem))}catch(e){}}
function scheduleReadingSave(){clearTimeout(saveTimer);saveTimer=setTimeout(saveReadingProgress,180)}
function restoreReadingPosition(){if(!resumeRequested)return false;const saved=getReadingMemory()[bookId];resumeRequested=false;if(!saved||typeof saved.scrollRatio!=='number')return false;requestAnimationFrame(()=>requestAnimationFrame(()=>{const max=Math.max(0,paper.scrollHeight-paper.clientHeight);paper.scrollTop=Math.round(max*Math.min(1,Math.max(0,saved.scrollRatio)));updatePages();saveReadingProgress()}));return true}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function blocks(text){return String(text||'').split(/\n{2,}/).map(x=>x.trim()).filter(Boolean).map(block=>{if(/^\*\s*\*\s*\*$/.test(block)||/^◆/.test(block))return '<div class="scene">◆ ◆ ◆</div>';if(block.startsWith('## '))return '<h3>'+esc(block.slice(3))+'</h3>';const fm=block.match(/^\[\[FIGURE:(\d+)\|([^|]*)\|(.*)\]\]$/s);if(fm){const n=Number(fm[1]),src='assets/books/artes-magicas/volume-iv-figura-'+String(n).padStart(2,'0')+'.webp';return '<figure class="magic-figure"><img src="'+src+'" alt="'+esc(fm[2])+'" loading="lazy" onerror="this.hidden=true;this.parentElement.classList.add(\'no-image\')"><figcaption><strong>Figura '+n+' · '+esc(fm[2])+'</strong>'+esc(fm[3])+'</figcaption></figure>'}return '<p class="'+(block.includes('\n')?'verse':'')+'">'+esc(block).replace(/\n/g,'<br>')+'</p>'}).join('')}
function closeMenu(){shell.classList.remove('menu-open');document.getElementById('menuBtn').setAttribute('aria-expanded','false')}
function setUrl(){history.replaceState(null,'',currentReaderUrl())}
function renderSidebar(){document.getElementById('sideTitle').textContent=data.title;document.title=data.title+' · Lumyriel';document.getElementById('sideEdition').textContent=data.edition;document.getElementById('sideKind').textContent=data.subtitle||'Leitura';hierarchy.innerHTML='';chapterList.innerHTML='';if(bookId==='filho'){data.chapters.forEach((x,i)=>{const b=document.createElement('button');b.className='chapter-btn'+(i===state.ch?' active':'');if(i===state.ch)b.setAttribute('aria-current','true');b.innerHTML='<strong>'+esc(x.number)+' · '+esc(x.title)+'</strong>';b.onclick=()=>{state.ch=i;render();closeMenu()};chapterList.appendChild(b)});return}if(bookId==='matematica'){const intro=document.createElement('button');intro.className='note-btn'+(state.intro?' active':'');intro.textContent='Abertura da Primeira Edição';intro.onclick=()=>{state.intro=true;render();closeMenu()};hierarchy.appendChild(intro);data.chapters.forEach((x,i)=>{const b=document.createElement('button');b.className='chapter-btn'+(i===state.ch&&!state.intro?' active':'');if(i===state.ch&&!state.intro)b.setAttribute('aria-current','true');const lead=x.appendix?'Apêndice '+x.number:'Capítulo '+x.number;b.innerHTML='<strong>'+esc(lead)+'</strong><small>'+esc(x.title)+(x.sectionRoman?' · '+esc(x.sectionRoman):'')+'</small>';b.onclick=()=>{state.ch=i;state.intro=false;render();closeMenu()};chapterList.appendChild(b)});return}if(bookId==='magia'){const v=data.volumes[state.v]||data.volumes[0];state.v=Math.min(state.v,data.volumes.length-1);const intro=document.createElement('button');intro.className='note-btn'+(state.intro?' active':'');intro.textContent='Abertura do volume';intro.onclick=()=>{state.intro=true;render();closeMenu()};hierarchy.appendChild(intro);const wrap=document.createElement('div');wrap.className='selector';wrap.innerHTML='<label>Volume</label>';const sel=document.createElement('select');data.volumes.forEach((x,i)=>{const o=document.createElement('option');o.value=i;o.textContent='Volume '+x.roman+' — '+x.title;o.selected=i===state.v;sel.appendChild(o)});sel.onchange=()=>{state.v=Number(sel.value);state.ch=0;state.intro=true;render()};wrap.appendChild(sel);hierarchy.appendChild(wrap);state.ch=Math.min(state.ch,Math.max(0,v.chapters.length-1));v.chapters.forEach((x,i)=>{const b=document.createElement('button');b.className='chapter-btn'+(i===state.ch&&!state.intro?' active':'');b.innerHTML='<strong>Capítulo '+esc(x.number)+'</strong><small>'+esc(x.title)+'</small>';b.onclick=()=>{state.ch=i;state.intro=false;render();closeMenu()};chapterList.appendChild(b)});return}const note=document.createElement('button');note.className='note-btn'+(state.note?' active':'');note.textContent='Nota editorial';note.onclick=()=>{state.note=true;render();closeMenu()};hierarchy.appendChild(note);const cWrap=document.createElement('div');cWrap.className='selector';cWrap.innerHTML='<label>Coleção</label>';const cSel=document.createElement('select');data.collections.forEach((c,i)=>{const o=document.createElement('option');o.value=i;o.textContent='Coleção '+c.roman+' — '+c.title;o.selected=i===state.c;cSel.appendChild(o)});cSel.onchange=()=>{state.c=Number(cSel.value);state.b=0;state.ch=0;state.note=false;render()};cWrap.appendChild(cSel);hierarchy.appendChild(cWrap);const col=data.collections[state.c]||data.collections[0];state.c=Math.min(state.c,data.collections.length-1);state.b=Math.min(state.b,col.books.length-1);const bWrap=document.createElement('div');bWrap.className='selector';bWrap.innerHTML='<label>Livro</label>';const bSel=document.createElement('select');col.books.forEach((b,i)=>{const o=document.createElement('option');o.value=i;o.textContent=String(b.number).padStart(2,'0')+' — '+b.title;o.selected=i===state.b;bSel.appendChild(o)});bSel.onchange=()=>{state.b=Number(bSel.value);state.ch=0;state.note=false;render()};bWrap.appendChild(bSel);hierarchy.appendChild(bWrap);const bk=col.books[state.b];state.ch=Math.min(state.ch,Math.max(0,bk.chapters.length-1));bk.chapters.forEach((x,i)=>{const b=document.createElement('button');b.className='chapter-btn'+(i===state.ch&&!state.note?' active':'');b.innerHTML='<strong>Capítulo '+esc(x.number)+'</strong><small>'+esc(x.title)+'</small>';b.onclick=()=>{state.ch=i;state.note=false;render();closeMenu()};chapterList.appendChild(b)})}
function currentFlatIndex(){if(bookId==='filho'||bookId==='matematica')return {index:state.ch,total:data.chapters.length};let flat=[],target=-1;if(bookId==='magia'){data.volumes.forEach((v,vi)=>v.chapters.forEach((ch,hi)=>{if(vi===state.v&&hi===state.ch)target=flat.length;flat.push({vi,hi})}));return {index:target,total:flat.length,flat}}data.collections.forEach((c,ci)=>c.books.forEach((b,bi)=>b.chapters.forEach((ch,hi)=>{if(ci===state.c&&bi===state.b&&hi===state.ch)target=flat.length;flat.push({ci,bi,hi})})));return {index:target,total:flat.length,flat}}
function goRelative(delta){if(bookId==='tempos'&&state.note){state.note=false;render();return}if((bookId==='magia'||bookId==='matematica')&&state.intro){state.intro=false;state.ch=0;render();return}const f=currentFlatIndex(),n=f.index+delta;if(n<0||n>=f.total)return;if(bookId==='filho'||bookId==='matematica')state.ch=n;else if(bookId==='magia'){const x=f.flat[n];state.v=x.vi;state.ch=x.hi;state.intro=false}else{const x=f.flat[n];state.c=x.ci;state.b=x.bi;state.ch=x.hi}render()}
function partHtml(ch){if(!ch||!ch.part)return '';return '<div class="part-banner"><strong>'+esc(ch.part)+'</strong>'+(ch.partIntro?'<p>'+esc(ch.partIntro).replace(/\n\n/g,'</p><p>').replace(/^##\s*/,'')+'</p>':'')+'</div>'}
function renderContent(){if(bookId==='tempos'&&state.note){paperInner.innerHTML='<div class="kicker">Os Livros dos Tempos</div><h2 class="editorial-title">Nota Editorial</h2><div class="content">'+blocks(data.editorial)+'</div><div class="nav-bottom"><button disabled>← Anterior</button><button onclick="state.note=false;render()">Começar a leitura →</button></div>';progress.textContent='Nota editorial';return}if(bookId==='matematica'&&state.intro){paperInner.innerHTML='<div class="reader-meta"><span>'+esc(data.edition)+'</span><span>48 capítulos · 13 partes · 8 apêndices</span></div><div class="book-title">Matemática e Física de Lumyriel</div><div class="kicker">Primeira Edição</div><h2 class="editorial-title">Abertura</h2><div class="content">'+blocks(data.intro)+'</div><div class="nav-bottom"><button disabled>← Anterior</button><button id="startMath">Começar a leitura →</button></div>';document.getElementById('startMath').onclick=()=>{state.intro=false;state.ch=0;render()};progress.textContent='Abertura';return}if(bookId==='magia'&&state.intro){const v=data.volumes[state.v];paperInner.innerHTML='<div class="reader-meta"><span>'+esc(data.edition)+'</span><span>'+esc(v.version)+' · '+esc(v.pages)+' páginas</span></div><div class="book-title">Artes Mágicas Lumyrielianas</div><div class="kicker">Volume '+esc(v.roman)+'</div><h2 class="editorial-title">'+esc(v.title)+'</h2><div class="content">'+blocks(v.intro)+'</div><div class="nav-bottom"><button '+(state.v===0?'disabled':'id="prevVolumeIntro"')+'>← Volume anterior</button><button id="startVolume">Começar o volume →</button></div>';const start=document.getElementById('startVolume');start.onclick=()=>{state.intro=false;state.ch=0;render()};const prev=document.getElementById('prevVolumeIntro');if(prev)prev.onclick=()=>{state.v--;state.ch=0;state.intro=true;render()};progress.textContent='Volume '+v.roman+' · abertura';return}let ch,bookLabel='',meta='';if(bookId==='filho'){state.ch=Math.min(state.ch,data.chapters.length-1);ch=data.chapters[state.ch];meta='Capítulo '+(state.ch+1)+' de '+data.chapters.length;bookLabel=data.title}else if(bookId==='matematica'){state.ch=Math.min(state.ch,data.chapters.length-1);ch=data.chapters[state.ch];meta='Leitura '+(state.ch+1)+' de '+data.chapters.length;bookLabel=data.title}else if(bookId==='magia'){const v=data.volumes[state.v];state.ch=Math.min(state.ch,v.chapters.length-1);ch=v.chapters[state.ch];meta='Volume '+v.roman+' · Capítulo '+ch.number;bookLabel='Volume '+v.roman+' — '+v.title}else{const col=data.collections[state.c],bk=col.books[state.b];state.ch=Math.min(state.ch,bk.chapters.length-1);ch=bk.chapters[state.ch];meta='Livro '+bk.number+' · Capítulo '+ch.number;bookLabel='Coleção '+col.roman+' · Livro '+bk.number+' — '+bk.title}const f=currentFlatIndex(),unit=(bookId==='matematica'&&ch.appendix?'Apêndice ':'Capítulo ');paperInner.innerHTML='<div class="reader-meta"><span>'+esc(data.edition)+'</span><span>'+esc(meta)+'</span></div>'+partHtml(ch)+'<div class="book-title">'+esc(bookLabel)+'</div><div class="kicker">'+esc(unit+ch.number)+'</div><h2 class="chapter-title">'+esc(ch.title)+'</h2><div class="content">'+blocks(ch.body)+'</div><div class="nav-bottom"><button id="prevBtn">← Anterior</button><button id="nextBtn">Próximo →</button></div>';const prev=document.getElementById('prevBtn'),next=document.getElementById('nextBtn');prev.disabled=f.index<=0;next.disabled=f.index>=f.total-1;prev.onclick=()=>goRelative(-1);next.onclick=()=>goRelative(1);progress.textContent=bookId==='filho'?'Capítulo '+(state.ch+1)+' de '+data.chapters.length:bookId==='magia'?'Capítulo '+(f.index+1)+' de '+f.total+' · 6 volumes':bookId==='matematica'?'Leitura '+(state.ch+1)+' de '+data.chapters.length:'Capítulo '+(f.index+1)+' de '+f.total}
function updatePages(){const vh=Math.max(1,paper.clientHeight),total=Math.max(1,Math.ceil(paper.scrollHeight/vh)),max=Math.max(0,paper.scrollHeight-vh),ratio=max?Math.min(1,Math.max(0,paper.scrollTop/max)):0,current=total===1?1:Math.min(total,Math.floor(ratio*(total-1))+1);pageCount.textContent='Página '+current+' de '+total}
let renderToken=0;
async function render(){const token=++renderToken;renderSidebar();if(bookId==='matematica'&&!state.intro){paperInner.innerHTML='<div class="loading" role="status" aria-live="polite">Abrindo esta parte…</div>';try{await ensureMathChapter(state.ch)}catch(err){if(token!==renderToken)return;paperInner.innerHTML='<div class="loading">Não foi possível abrir esta parte agora.</div>';console.error(err);return}}if(token!==renderToken)return;renderContent();paper.scrollTop=0;setUrl();requestAnimationFrame(()=>{updatePages();if(!restoreReadingPosition())saveReadingProgress()})}
document.getElementById('menuBtn').onclick=()=>{const open=shell.classList.toggle('menu-open');document.getElementById('menuBtn').setAttribute('aria-expanded',open?'true':'false')};document.getElementById('menuBackdrop').onclick=closeMenu;
function enableReadingProtection(){if(!READER_PROTECTION)return;['copy','cut','contextmenu','selectstart','dragstart'].forEach(type=>shell.addEventListener(type,e=>{const tag=(e.target&&e.target.tagName||'').toLowerCase();if(tag==='select'||tag==='option'||tag==='button'||tag==='a')return;e.preventDefault()},true));document.addEventListener('keydown',e=>{const key=String(e.key||'').toLowerCase(),mod=e.ctrlKey||e.metaKey;if(mod&&['c','s','p','u','a'].includes(key)){e.preventDefault();e.stopPropagation();return}if(e.key==='F12'||(mod&&e.shiftKey&&['i','j','c','k'].includes(key))){e.preventDefault();e.stopPropagation()}},true);if(window.top!==window.self){try{window.top.location=window.self.location.href}catch(err){document.body.innerHTML='<div class="loading">Abra esta edição diretamente na Biblioteca Lumyrieliana.</div>'}}}
enableReadingProtection();paper.addEventListener('scroll',()=>{requestAnimationFrame(updatePages);scheduleReadingSave()},{passive:true});window.addEventListener('resize',()=>requestAnimationFrame(updatePages));window.addEventListener('pagehide',saveReadingProgress);document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'&&e.altKey)goRelative(-1);if(e.key==='ArrowRight'&&e.altKey)goRelative(1);if(e.key==='Escape')closeMenu()});
loadBookData(bookId).then(x=>{data=x;if(bookId==='tempos'){state.c=Math.min(state.c,data.collections.length-1);state.b=Math.min(state.b,data.collections[state.c].books.length-1);state.ch=Math.min(state.ch,data.collections[state.c].books[state.b].chapters.length-1)}else if(bookId==='magia'){state.v=Math.min(state.v,data.volumes.length-1);state.ch=Math.min(state.ch,data.volumes[state.v].chapters.length-1)}else if(bookId==='matematica'){state.ch=Math.min(state.ch,data.chapters.length-1);if(!location.search.includes('intro=')&&!location.search.includes('ch='))state.intro=true}else state.ch=Math.min(state.ch,data.chapters.length-1);render()}).catch(err=>{paperInner.innerHTML='<div class="loading">Não foi possível abrir esta edição agora.</div>';console.error(err)});
</script>
