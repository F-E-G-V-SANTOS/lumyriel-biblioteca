<style>.skip-link{position:fixed;left:12px;top:10px;z-index:1000;transform:translateY(-160%);background:#e6dcc9;color:#17130f;padding:8px 11px;text-decoration:none;border:1px solid #aa8a58}.skip-link:focus{transform:translateY(0)}

:root{--bg:#0b0a08;--panel:#12100d;--paper:#eadfc8;--paper2:#cfbb95;--ink:#292219;--muted:#958b7c;--gold:#aa8a58;--gold2:#cfb785;--line:#3c3328}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:#eee4d2;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,select{font:inherit}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:999;opacity:.1;background:repeating-linear-gradient(96deg,rgba(255,255,255,.02) 0 1px,transparent 1px 5px)}
.topbar{height:64px;border-bottom:1px solid #41372a;background:rgba(11,10,8,.97);display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:fixed;inset:0 0 auto 0;z-index:30}
.brand{display:flex;align-items:center;gap:11px;color:#e9dfcd;text-decoration:none;font:400 1rem Georgia,serif;letter-spacing:.05em}.brand:before{content:"";width:25px;height:1px;background:var(--gold)}
.back{border:1px solid #4c4131;border-radius:2px;padding:8px 11px;color:#d7cdbc;text-decoration:none;font-size:.8rem;background:#15120e}
.shell{height:calc(100vh - 64px);margin-top:64px;display:grid;grid-template-columns:310px 1fr;overflow:hidden}
.sidebar{border-right:1px solid #41372a;background:repeating-linear-gradient(92deg,rgba(255,255,255,.01) 0 1px,transparent 1px 5px),linear-gradient(180deg,#15120e,#0d0c0a);overflow:auto;padding:22px}.side-cover{width:116px;aspect-ratio:.555;margin:2px auto 20px;background:#17130f center/cover no-repeat;border:1px solid #66543d;border-radius:1px 4px 4px 1px;box-shadow:10px 12px 24px rgba(0,0,0,.4),inset 6px 0 10px rgba(0,0,0,.25);position:relative;overflow:hidden}.side-cover:after{display:none}.mini{font-size:.68rem;text-transform:uppercase;letter-spacing:.16em;color:var(--gold2)}.sidebar h1{font:400 1.85rem/1.05 Georgia,serif;margin:8px 0 6px}.edition{color:#92897d;font-size:.8rem;margin-bottom:18px}
.selector{margin:12px 0}.selector label{display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:#958b7c;margin-bottom:6px}.selector select{width:100%;background:#17130f;border:1px solid #463c2f;color:#ddd2bf;border-radius:2px;padding:10px}
.chapter-list{display:grid;gap:5px;margin-top:14px}.chapter-btn,.note-btn{width:100%;text-align:left;border:1px solid #312a22;background:#14110e;color:#aaa094;border-radius:2px;padding:9px 10px;cursor:pointer;line-height:1.3}.chapter-btn:hover,.chapter-btn.active,.note-btn:hover,.note-btn.active{border-color:#765f3f;color:#efe3cf;background:#241e15}.chapter-btn small{display:block;color:#7e756a;margin-top:3px}
.paper-wrap{position:relative;background:#17130f;overflow:hidden}.paper{height:100%;overflow:auto;background:
 radial-gradient(circle at 16% 8%,rgba(120,91,54,.055),transparent 18%),
 radial-gradient(circle at 82% 76%,rgba(120,91,54,.035),transparent 22%),
 repeating-linear-gradient(96deg,rgba(72,55,33,.02) 0 1px,transparent 1px 5px),
 linear-gradient(90deg,#ccb78f,#eadfc8 6%,#eadfc8 94%,#c9b189);
 color:var(--ink);padding:52px clamp(24px,7vw,110px) 94px;scroll-behavior:smooth;box-shadow:inset 14px 0 30px rgba(69,51,30,.16),inset -14px 0 30px rgba(69,51,30,.12)}
.paper-inner{max-width:780px;margin:0 auto}.reader-meta{display:flex;justify-content:space-between;gap:16px;align-items:center;color:#776a58;font-size:.78rem;margin-bottom:34px;padding-bottom:12px;border-bottom:1px solid rgba(82,64,42,.2)}.kicker{text-transform:uppercase;letter-spacing:.17em;font-size:.69rem;color:#8a6b40;margin-bottom:10px}.chapter-title{font:400 clamp(2.2rem,5vw,4rem)/1.04 Georgia,serif;margin:0 0 36px;color:#2e261c}.book-title{font:400 1.05rem Georgia,serif;color:#675846;margin-bottom:8px}
.content p{font:1.09rem/1.87 Georgia,"Times New Roman",serif;margin:0 0 1.2em}.content p:first-child::first-letter{float:left;font-size:4rem;line-height:.8;padding:9px 9px 0 0;color:#73552d}.content .verse{white-space:normal}.scene{margin:32px 0;text-align:center;letter-spacing:.55em;color:#8c7859}.editorial-title{font:400 2.8rem Georgia,serif;margin:0 0 28px}.nav-bottom{display:flex;justify-content:space-between;gap:12px;margin-top:54px;padding-top:24px;border-top:1px solid rgba(76,61,42,.28)}.nav-bottom button{border:1px solid rgba(84,68,46,.38);background:rgba(255,255,255,.12);color:#4e4232;border-radius:2px;padding:10px 14px;cursor:pointer}.nav-bottom button:disabled{opacity:.35;cursor:not-allowed}
.page-count,.progress{position:absolute;bottom:16px;z-index:8;border:1px solid rgba(84,68,46,.32);background:rgba(229,214,184,.9);color:#625540;border-radius:2px;padding:8px 11px;font-size:.74rem;pointer-events:none;box-shadow:0 5px 18px rgba(54,42,28,.1)}.page-count{right:18px;min-width:128px;text-align:center;font-weight:650}.progress{left:18px}
.mobile-menu{display:none;border:1px solid #4c4131;background:#15120e;color:#ddd3c1;border-radius:2px;padding:8px 10px}.menu-backdrop{display:none;border:0;padding:0}.loading{min-height:60vh;display:grid;place-items:center;color:#756957;font:italic 1.15rem Georgia,serif}
@media(max-width:850px){.topbar{gap:8px}.brand{font-size:.9rem;min-width:0}.back{font-size:.75rem;padding:7px 9px}.mobile-menu{display:inline-flex}.shell{display:block}.sidebar{position:fixed;z-index:25;top:64px;bottom:0;left:0;width:min(88vw,330px);transform:translateX(-102%);transition:.22s;box-shadow:18px 0 45px rgba(0,0,0,.45)}.menu-backdrop{position:fixed;z-index:24;inset:64px 0 0;background:rgba(0,0,0,.56)}.shell.menu-open .sidebar{transform:translateX(0)}.shell.menu-open .menu-backdrop{display:block}.paper-wrap{height:100%}.paper{padding:34px 20px 92px}.chapter-title{font-size:2.55rem}.content p{font-size:1.04rem;line-height:1.76}.page-count{right:12px;bottom:12px;min-width:110px}.progress{left:12px;bottom:12px;max-width:52%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}}

::selection{background:rgba(126,94,52,.24);color:#241d15}a:focus-visible,button:focus-visible,select:focus-visible{outline:1px solid var(--gold2);outline-offset:3px}
@media(prefers-reduced-motion:reduce){.paper{scroll-behavior:auto}.sidebar{transition:none!important}}

@media(max-width:480px){.brand span{font-size:0}.brand span:after{content:"Lumyriel";font-size:.86rem}.brand:before{width:18px}.topbar{padding-inline:10px}.mobile-menu,.back{min-height:38px}.paper{padding-inline:17px}.reader-meta{align-items:flex-start;flex-direction:column;gap:4px}.chapter-title{font-size:2.25rem}.side-cover{width:104px}}

/* índice editorial: capítulos como sumário, não como botões de aplicativo */
.sidebar{padding:24px 20px 28px}
.sidebar .mini{padding-top:4px}
.sidebar h1{margin-top:7px;margin-bottom:7px}
.edition{padding-bottom:15px;border-bottom:1px solid #30291f}
.chapter-list{gap:0;margin-top:16px;border-top:1px solid #30291f}
.chapter-btn,.note-btn{border:0;border-bottom:1px solid #2c261e;background:transparent;border-radius:0;padding:10px 4px;color:#9f9689}
.chapter-btn:hover,.note-btn:hover{border-color:#51432f;background:transparent;color:#e8dcc8}
.chapter-btn.active,.note-btn.active{border-color:#6c5739;background:transparent;color:#efe3cf;box-shadow:inset 2px 0 0 #9a7c4e;padding-left:11px}
.chapter-btn strong{font-family:Georgia,"Times New Roman",serif;font-weight:400}
.chapter-btn small{font-size:.72rem;margin-top:4px}
.selector{padding-bottom:12px;border-bottom:1px solid #30291f}
.selector select{border:0;border-bottom:1px solid #594936;border-radius:0;padding:9px 2px;background:transparent}
.page-count,.progress{border:0;background:transparent;box-shadow:none;border-radius:0;padding:0;color:#7a6c58;font:500 .71rem/1 Georgia,"Times New Roman",serif;letter-spacing:.04em}
.page-count{min-width:0}
.paper-inner{position:relative}
.paper-inner:before{content:"";display:block;width:42px;height:1px;background:rgba(91,69,43,.35);margin:0 0 30px}
.nav-bottom button{border:0;border-bottom:1px solid rgba(84,68,46,.42);background:transparent;border-radius:0;padding:10px 2px}
.nav-bottom button:hover:not(:disabled){border-color:#765c38}

.nojs{margin:82px auto 20px;width:min(760px,calc(100% - 32px));padding:18px 0;border-top:1px solid #51432f;border-bottom:1px solid #51432f;color:#b8ad9c;display:grid;gap:7px}.nojs strong{font:400 1.25rem Georgia,"Times New Roman",serif;color:#e7dbc7}.nojs span{font-size:.9rem}.nojs a{width:max-content;color:#cfb785;text-decoration:none;border-bottom:1px solid #6f5b3c}
</style>

<body><a class="skip-link" href="#paper">Pular para a leitura</a>
<header class="topbar">
  <a class="brand" href="index.html"><span>Biblioteca de Lumyriel</span></a>
  <div style="display:flex;gap:8px;align-items:center"><button id="menuBtn" class="mobile-menu" type="button" aria-controls="sidebar" aria-expanded="false">Capítulos</button><a class="back" href="index.html">← Biblioteca</a></div>
</header>
<noscript><div class="nojs"><strong>Leitor indisponível sem JavaScript.</strong><span>Os livros são arquivos locais do próprio site, mas esta página precisa de JavaScript para carregar capítulos e navegação.</span><a href="index.html">Voltar à Biblioteca</a></div></noscript>
<div class="shell" id="shell">
  <button class="menu-backdrop" id="menuBackdrop" type="button" aria-label="Fechar lista de capítulos"></button>
  <aside class="sidebar" id="sidebar">
    <div class="side-cover" id="sideCover" aria-hidden="true"></div>
    <div class="mini" id="sideKind">Leitura</div>
    <h1 id="sideTitle">Carregando…</h1>
    <div class="edition" id="sideEdition"></div>
    <div id="hierarchy"></div>
    <div class="chapter-list" id="chapterList"></div>
  </aside>
  <main class="paper-wrap">
    <article class="paper" id="paper">
      <div class="paper-inner" id="paperInner"><div class="loading" role="status" aria-live="polite">Abrindo o livro…</div></div>
    </article>
    <div class="progress" id="progress" aria-live="polite">Carregando…</div>
    <div class="page-count" id="pageCount" aria-label="Paginação aproximada">Página 1 de 1</div>
  </main>
</div>
<script src="assets/covers-data.js"></script>
<script>
const DATA={filho:'books/o-filho-da-montanha.json',tempos:'books/os-livros-dos-tempos.json'};
const q=new URLSearchParams(location.search);
const bookId=DATA[q.get('book')]?q.get('book'):'filho';
const shell=document.getElementById('shell'),paper=document.getElementById('paper'),paperInner=document.getElementById('paperInner'),chapterList=document.getElementById('chapterList'),hierarchy=document.getElementById('hierarchy'),pageCount=document.getElementById('pageCount'),progress=document.getElementById('progress'),sideCover=document.getElementById('sideCover');
if(window.LUMYRIEL_COVERS){sideCover.style.backgroundImage='url("'+(bookId==='tempos'?window.LUMYRIEL_COVERS.tempos:window.LUMYRIEL_COVERS.filho)+'")';}
let data=null,state={c:Math.max(0,Number(q.get('c')||0)),b:Math.max(0,Number(q.get('b')||0)),ch:Math.max(0,Number(q.get('ch')||0)),note:q.get('note')==='1'};
const READING_KEY='lumyriel-reading-progress-v1';
let resumeRequested=q.get('resume')==='1',saveTimer=null;
function getReadingMemory(){try{return JSON.parse(localStorage.getItem(READING_KEY)||'{}')||{}}catch(e){return {}}}
function currentReaderUrl(){
  const p=new URLSearchParams({book:bookId});
  if(bookId==='tempos'){p.set('c',state.c);p.set('b',state.b);p.set('ch',state.ch);if(state.note)p.set('note','1')}
  else p.set('ch',state.ch);
  return 'reader.html?'+p.toString();
}
function currentReadingLabel(){
  if(!data)return '';
  if(state.note&&bookId==='tempos')return 'Nota editorial';
  if(bookId==='filho'){const ch=data.chapters[state.ch];return ch?'Capítulo '+ch.number+' · '+ch.title:''}
  const col=data.collections[state.c],bk=col&&col.books[state.b],ch=bk&&bk.chapters[state.ch];
  return bk&&ch?'Livro '+bk.number+' · Capítulo '+ch.number+' · '+ch.title:'';
}
function saveReadingProgress(){
  if(!data)return;
  const max=Math.max(0,paper.scrollHeight-paper.clientHeight),ratio=max?Math.min(1,Math.max(0,paper.scrollTop/max)):0;
  const mem=getReadingMemory();
  mem[bookId]={book:bookId,title:data.title||'',label:currentReadingLabel(),url:currentReaderUrl(),scrollRatio:ratio,updatedAt:Date.now()};
  mem.last=bookId;
  try{localStorage.setItem(READING_KEY,JSON.stringify(mem))}catch(e){}
}
function scheduleReadingSave(){clearTimeout(saveTimer);saveTimer=setTimeout(saveReadingProgress,180)}
function restoreReadingPosition(){
  if(!resumeRequested)return false;
  const mem=getReadingMemory(),saved=mem[bookId];
  resumeRequested=false;
  if(!saved||typeof saved.scrollRatio!=='number')return false;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    const max=Math.max(0,paper.scrollHeight-paper.clientHeight);
    paper.scrollTop=Math.round(max*Math.min(1,Math.max(0,saved.scrollRatio)));
    updatePages();
    saveReadingProgress();
  }));
  return true;
}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function blocks(text){
  return String(text||'').split(/\n{2,}/).map(x=>x.trim()).filter(Boolean).map(block=>{
    if(/^\*\s*\*\s*\*$/.test(block)||/^◆/.test(block))return '<div class="scene">◆ ◆ ◆</div>';
    return '<p class="'+(block.includes('\n')?'verse':'')+'">'+esc(block).replace(/\n/g,'<br>')+'</p>';
  }).join('');
}
function closeMenu(){shell.classList.remove('menu-open');document.getElementById('menuBtn').setAttribute('aria-expanded','false')}
function setUrl(){
  const p=new URLSearchParams({book:bookId});
  if(bookId==='tempos'){p.set('c',state.c);p.set('b',state.b);p.set('ch',state.ch);if(state.note)p.set('note','1')}
  else p.set('ch',state.ch);
  history.replaceState(null,'','reader.html?'+p.toString());
}
function renderSidebar(){
  document.getElementById('sideTitle').textContent=data.title;document.title=data.title+' · Lumyriel';
  document.getElementById('sideEdition').textContent=data.edition;
  document.getElementById('sideKind').textContent=data.subtitle||'Leitura';
  hierarchy.innerHTML='';
  chapterList.innerHTML='';
  if(bookId==='filho'){
    data.chapters.forEach((x,i)=>{
      const b=document.createElement('button');b.className='chapter-btn'+(i===state.ch&&!state.note?' active':'');if(i===state.ch&&!state.note)b.setAttribute('aria-current','true');b.innerHTML='<strong>'+esc(x.number)+' · '+esc(x.title)+'</strong>';b.onclick=()=>{state.ch=i;state.note=false;render();closeMenu()};chapterList.appendChild(b);
    });
    return;
  }
  const note=document.createElement('button');note.className='note-btn'+(state.note?' active':'');if(state.note)note.setAttribute('aria-current','true');note.textContent='Nota editorial';note.onclick=()=>{state.note=true;render();closeMenu()};hierarchy.appendChild(note);
  const cWrap=document.createElement('div');cWrap.className='selector';cWrap.innerHTML='<label>Coleção</label>';
  const cSel=document.createElement('select');
  data.collections.forEach((c,i)=>{const o=document.createElement('option');o.value=i;o.textContent='Coleção '+c.roman+' — '+c.title;o.selected=i===state.c;cSel.appendChild(o)});
  cSel.onchange=()=>{state.c=Number(cSel.value);state.b=0;state.ch=0;state.note=false;render()};
  cWrap.appendChild(cSel);hierarchy.appendChild(cWrap);
  const col=data.collections[state.c]||data.collections[0];
  state.c=Math.min(state.c,data.collections.length-1);state.b=Math.min(state.b,col.books.length-1);
  const bWrap=document.createElement('div');bWrap.className='selector';bWrap.innerHTML='<label>Livro</label>';
  const bSel=document.createElement('select');
  col.books.forEach((b,i)=>{const o=document.createElement('option');o.value=i;o.textContent=String(b.number).padStart(2,'0')+' — '+b.title;o.selected=i===state.b;bSel.appendChild(o)});
  bSel.onchange=()=>{state.b=Number(bSel.value);state.ch=0;state.note=false;render()};
  bWrap.appendChild(bSel);hierarchy.appendChild(bWrap);
  const bk=col.books[state.b];state.ch=Math.min(state.ch,Math.max(0,bk.chapters.length-1));
  bk.chapters.forEach((x,i)=>{const b=document.createElement('button');b.className='chapter-btn'+(i===state.ch&&!state.note?' active':'');if(i===state.ch&&!state.note)b.setAttribute('aria-current','true');b.innerHTML='<strong>Capítulo '+esc(x.number)+'</strong><small>'+esc(x.title)+'</small>';b.onclick=()=>{state.ch=i;state.note=false;render();closeMenu()};chapterList.appendChild(b)});
}
function currentFlatIndex(){
 if(bookId==='filho')return {index:state.ch,total:data.chapters.length};
 let flat=[],target=-1;
 data.collections.forEach((c,ci)=>c.books.forEach((b,bi)=>b.chapters.forEach((ch,hi)=>{if(ci===state.c&&bi===state.b&&hi===state.ch)target=flat.length;flat.push({ci,bi,hi})})));
 return {index:target,total:flat.length,flat};
}
function goRelative(delta){
 if(state.note){state.note=false;render();return}
 const f=currentFlatIndex(),n=f.index+delta;if(n<0||n>=f.total)return;
 if(bookId==='filho')state.ch=n;else{const x=f.flat[n];state.c=x.ci;state.b=x.bi;state.ch=x.hi}
 render();
}
function renderContent(){
 if(state.note&&bookId==='tempos'){
   paperInner.innerHTML='<div class="kicker">Os Livros dos Tempos</div><h2 class="editorial-title">Nota Editorial</h2><div class="content">'+blocks(data.editorial)+'</div><div class="nav-bottom"><button disabled>← Anterior</button><button onclick="state.note=false;render()">Começar a leitura →</button></div>';
   progress.textContent='Nota editorial';return;
 }
 let ch,bookLabel='',meta='';
 if(bookId==='filho'){
   state.ch=Math.min(state.ch,data.chapters.length-1);ch=data.chapters[state.ch];meta='Capítulo '+(state.ch+1)+' de '+data.chapters.length;bookLabel=data.title;
 }else{
   const col=data.collections[state.c],bk=col.books[state.b];state.ch=Math.min(state.ch,bk.chapters.length-1);ch=bk.chapters[state.ch];meta='Livro '+bk.number+' · Capítulo '+ch.number;bookLabel='Coleção '+col.roman+' · Livro '+bk.number+' — '+bk.title;
 }
 const f=currentFlatIndex();
 paperInner.innerHTML='<div class="reader-meta"><span>'+esc(data.edition)+'</span><span>'+esc(meta)+'</span></div><div class="book-title">'+esc(bookLabel)+'</div><div class="kicker">'+(bookId==='filho'?'Capítulo '+esc(ch.number):'Capítulo '+esc(ch.number))+'</div><h2 class="chapter-title">'+esc(ch.title)+'</h2><div class="content">'+blocks(ch.body)+'</div><div class="nav-bottom"><button id="prevBtn">← Anterior</button><button id="nextBtn">Próximo →</button></div>';
 const prev=document.getElementById('prevBtn'),next=document.getElementById('nextBtn');prev.disabled=f.index<=0;next.disabled=f.index>=f.total-1;prev.onclick=()=>goRelative(-1);next.onclick=()=>goRelative(1);
 progress.textContent=bookId==='filho'?'Capítulo '+(state.ch+1)+' de '+data.chapters.length:'Capítulo '+(f.index+1)+' de '+f.total;
}
function updatePages(){
 const vh=Math.max(1,paper.clientHeight),total=Math.max(1,Math.ceil(paper.scrollHeight/vh)),max=Math.max(0,paper.scrollHeight-vh),ratio=max?Math.min(1,Math.max(0,paper.scrollTop/max)):0,current=total===1?1:Math.min(total,Math.floor(ratio*(total-1))+1);
 pageCount.textContent='Página '+current+' de '+total;
}
function render(){renderSidebar();renderContent();paper.scrollTop=0;setUrl();requestAnimationFrame(()=>{updatePages();if(!restoreReadingPosition())saveReadingProgress()})}
document.getElementById('menuBtn').onclick=()=>{const open=shell.classList.toggle('menu-open');document.getElementById('menuBtn').setAttribute('aria-expanded',open?'true':'false')};document.getElementById('menuBackdrop').onclick=closeMenu;
paper.addEventListener('scroll',()=>{requestAnimationFrame(updatePages);scheduleReadingSave()},{passive:true});window.addEventListener('resize',()=>requestAnimationFrame(updatePages));window.addEventListener('pagehide',saveReadingProgress);
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'&&e.altKey)goRelative(-1);if(e.key==='ArrowRight'&&e.altKey)goRelative(1);if(e.key==='Escape')closeMenu()});
fetch(DATA[bookId]).then(r=>{if(!r.ok)throw new Error('Falha ao abrir o livro');return r.json()}).then(x=>{data=x;if(bookId==='tempos'){state.c=Math.min(state.c,data.collections.length-1);state.b=Math.min(state.b,data.collections[state.c].books.length-1);state.ch=Math.min(state.ch,data.collections[state.c].books[state.b].chapters.length-1)}else state.ch=Math.min(state.ch,data.chapters.length-1);render()}).catch(err=>{paperInner.innerHTML='<div class="loading">Não foi possível abrir esta edição agora.</div>';console.error(err)});
</script>
