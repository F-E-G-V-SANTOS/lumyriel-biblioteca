<style>

*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:#eee4d2;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,select{font:inherit}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:999;opacity:.1;background:repeating-linear-gradient(96deg,rgba(255,255,255,.02) 0 1px,transparent 1px 5px)}
.topbar{height:64px;border-bottom:1px solid #41372a;background:rgba(11,10,8,.97);display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:fixed;inset:0 0 auto;z-index:30}.brand{display:flex;align-items:center;gap:11px;color:#e9dfcd;text-decoration:none;font:400 1rem Georgia,serif;letter-spacing:.05em}.brand:before{content:"";width:25px;height:1px;background:var(--gold)}.reader-actions{display:flex;gap:8px;align-items:center}.feedback-reader,.back,.mobile-menu{border:1px solid #4c4131;border-radius:2px;padding:8px 11px;color:#d7cdbc;text-decoration:none;font-size:.8rem;background:#15120e}.mobile-menu{display:none}.shell{height:calc(100vh - 64px);margin-top:64px;display:grid;grid-template-columns:310px 1fr;overflow:hidden}.sidebar{border-right:1px solid #41372a;background:repeating-linear-gradient(92deg,rgba(255,255,255,.01) 0 1px,transparent 1px 5px),linear-gradient(180deg,#15120e,#0d0c0a);overflow:auto;padding:24px 20px 28px}.side-cover{width:116px;aspect-ratio:.555;margin:2px auto 20px;background:#17130f center/cover no-repeat;border:1px solid #66543d;border-radius:1px 4px 4px 1px;box-shadow:10px 12px 24px rgba(0,0,0,.4),inset 6px 0 10px rgba(0,0,0,.25)}.mini{font-size:.68rem;text-transform:uppercase;letter-spacing:.16em;color:var(--gold2);padding-top:4px}.sidebar h1{font:400 1.85rem/1.05 Georgia,serif;margin:7px 0}.edition{color:#92897d;font-size:.8rem;margin-bottom:18px;padding-bottom:15px;border-bottom:1px solid #30291f}.selector{margin:12px 0;padding-bottom:12px;border-bottom:1px solid #30291f}.selector label{display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:#958b7c;margin-bottom:6px}.selector select{width:100%;border:0;border-bottom:1px solid #594936;border-radius:0;padding:9px 2px;background:transparent;color:#ddd2bf}.chapter-list{display:grid;gap:0;margin-top:16px;border-top:1px solid #30291f}.chapter-btn,.note-btn{width:100%;text-align:left;border:0;border-bottom:1px solid #2c261e;background:transparent;color:#9f9689;padding:10px 4px;cursor:pointer;line-height:1.3}.chapter-btn:hover,.note-btn:hover{border-color:#51432f;color:#e8dcc8}.chapter-btn.active,.note-btn.active{border-color:#6c5739;color:#efe3cf;box-shadow:inset 2px 0 0 #9a7c4e;padding-left:11px}.chapter-btn strong{font-family:Georgia,"Times New Roman",serif;font-weight:400}.chapter-btn small{display:block;color:#7e756a;font-size:.72rem;margin-top:4px}
.paper-wrap{position:relative;background:#17130f;overflow:hidden}.paper{height:100%;overflow:auto;background:radial-gradient(circle at 16% 8%,rgba(120,91,54,.055),transparent 18%),radial-gradient(circle at 82% 76%,rgba(120,91,54,.035),transparent 22%),repeating-linear-gradient(96deg,rgba(72,55,33,.02) 0 1px,transparent 1px 5px),linear-gradient(90deg,#ccb78f,#eadfc8 6%,#eadfc8 94%,#c9b189);color:var(--ink);padding:52px clamp(24px,7vw,110px) 94px;scroll-behavior:smooth;box-shadow:inset 14px 0 30px rgba(69,51,30,.16),inset -14px 0 30px rgba(69,51,30,.12)}.paper-inner{max-width:780px;margin:0 auto;position:relative}.paper-inner:before{content:"";display:block;width:42px;height:1px;background:rgba(91,69,43,.35);margin:0 0 30px}.reader-meta{display:flex;justify-content:space-between;gap:16px;align-items:center;color:#776a58;font-size:.78rem;margin-bottom:34px;padding-bottom:12px;border-bottom:1px solid rgba(82,64,42,.2)}.kicker{text-transform:uppercase;letter-spacing:.17em;font-size:.69rem;color:#8a6b40;margin-bottom:10px}.chapter-title{font:400 clamp(2.2rem,5vw,4rem)/1.04 Georgia,serif;margin:0 0 36px;color:#2e261c}.book-title{font:400 1.05rem Georgia,serif;color:#675846;margin-bottom:8px}.content p{font:1.09rem/1.87 Georgia,"Times New Roman",serif;margin:0 0 1.2em}.content h3{font:400 1.42rem/1.28 Georgia,"Times New Roman",serif;color:#493b29;margin:2.1em 0 .72em;padding-top:.15em}.content h3:first-child{margin-top:0}.editorial-title{font:400 2.8rem/1.05 Georgia,serif;margin:0 0 28px}.part-banner{margin:0 0 34px;padding:16px 0 18px;border-top:1px solid rgba(90,67,39,.25);border-bottom:1px solid rgba(90,67,39,.25);color:#62513b}.part-banner strong{display:block;font:400 1.15rem/1.3 Georgia,serif;color:#4a3a27}.nav-bottom{display:flex;justify-content:space-between;gap:12px;margin-top:54px;padding-top:24px;border-top:1px solid rgba(76,61,42,.28)}.nav-bottom button{border:0;border-bottom:1px solid rgba(84,68,46,.42);background:transparent;color:#4e4232;padding:10px 2px;cursor:pointer}.nav-bottom button:disabled{opacity:.35;cursor:not-allowed}.page-count,.progress{position:absolute;bottom:16px;z-index:8;color:#7a6c58;font:500 .71rem/1 Georgia,"Times New Roman",serif;letter-spacing:.04em;pointer-events:none}.page-count{right:18px}.progress{left:18px}.menu-backdrop{display:none;border:0}.loading{min-height:60vh;display:grid;place-items:center;color:#756957;font:italic 1.15rem Georgia,serif}.shell,.shell *,.paper,.paper *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-user-drag:none}.shell select,.shell option,.shell button,.shell a{-webkit-user-select:auto;user-select:auto}::selection{background:transparent;color:inherit}
@media(max-width:850px){.topbar{gap:8px}.mobile-menu{display:inline-flex}.shell{display:block}.sidebar{position:fixed;z-index:25;top:64px;bottom:0;left:0;width:min(88vw,330px);transform:translateX(-102%);transition:.22s;box-shadow:18px 0 45px rgba(0,0,0,.45)}.menu-backdrop{position:fixed;z-index:24;inset:64px 0 0;background:rgba(0,0,0,.56)}.shell.menu-open .sidebar{transform:translateX(0)}.shell.menu-open .menu-backdrop{display:block}.paper-wrap{height:100%}.paper{padding:34px 20px 92px}.chapter-title{font-size:2.55rem}.content p{font-size:1.04rem;line-height:1.76}.page-count{right:12px;bottom:12px}.progress{left:12px;bottom:12px;max-width:52%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}}
@media(max-width:480px){.topbar{padding-inline:10px}.brand span{font-size:.74rem}.paper{padding-inline:17px}.reader-meta{align-items:flex-start;flex-direction:column;gap:4px}.chapter-title{font-size:2.25rem}.side-cover{width:104px}}
@media print{body>*{display:none!important}body:after{content:"A edição de leitura está disponível somente na Biblioteca Lumyrieliana.";display:block!important;padding:48px;font:18px/1.6 Georgia,serif;color:#111;background:#fff}}
</style>
<link rel="stylesheet" href="assets/support-widget.css">
</head>
<body>
<header class="topbar"><a class="brand" href="index.html"><span>Biblioteca Lumyrieliana</span></a><div class="reader-actions"><a id="readerFeedbackLink" class="feedback-reader" href="feedback.html">Feedback</a><button type="button" class="feedback-reader" data-support-project>Apoie</button><button id="menuBtn" class="mobile-menu" type="button" aria-controls="sidebar" aria-expanded="false">Capítulos</button><a class="back" href="index.html">← Biblioteca</a></div></header>
<div class="shell" id="shell"><button class="menu-backdrop" id="menuBackdrop" type="button" aria-label="Fechar lista de capítulos"></button><aside class="sidebar" id="sidebar"><div class="side-cover" id="sideCover" aria-hidden="true"></div><div class="mini" id="sideKind">Coleção Integral</div><h1 id="sideTitle">Construindo Mundos</h1><div class="edition" id="sideEdition">Carregando…</div><div class="selector"><label for="volumeSelector">Volume</label><select id="volumeSelector" aria-label="Escolher volume"></select></div><div id="hierarchy"></div><div class="chapter-list" id="chapterList"></div></aside><main class="paper-wrap"><article class="paper" id="paper"><div class="paper-inner" id="paperInner"><div class="loading" role="status" aria-live="polite">Abrindo o volume…</div></div></article><div class="progress" id="progress" aria-live="polite">Carregando…</div><div class="page-count" id="pageCount">Página 1 de 1</div></main></div>
<script src="assets/covers-data.js"></script><script src="assets/site-config.js"></script><script src="assets/support-widget.js"></script>
<script>
const DATA_URL='books/lmy-cm-v05.dat',READING_KEY='lumyriel-reading-progress-v1';
const q=new URLSearchParams(location.search),state={v:Math.max(0,Number(q.get('v')||0)),ch:Math.max(0,Number(q.get('ch')||0)),intro:q.get('intro')==='1'},shell=document.getElementById('shell'),paper=document.getElementById('paper'),paperInner=document.getElementById('paperInner'),chapterList=document.getElementById('chapterList'),volumeSelector=document.getElementById('volumeSelector'),progress=document.getElementById('progress'),pageCount=document.getElementById('pageCount'),sideEdition=document.getElementById('sideEdition'),sideCover=document.getElementById('sideCover');let data=null,saveTimer=null;
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function decodeGzipBase64(encoded){const clean=String(encoded||'').replace(/\s+/g,''),binary=atob(clean),bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);if(typeof DecompressionStream!=='function')throw new Error('Navegador sem suporte à leitura desta edição');const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));return new Response(stream).text().then(JSON.parse)}
function blocks(text){return String(text||'').split(/\n{2,}/).map(x=>x.trim()).filter(Boolean).map(block=>block.startsWith('## ')?'<h3>'+esc(block.slice(3))+'</h3>':'<p>'+esc(block).replace(/\n/g,'<br>')+'</p>').join('')}
function currentVolume(){return data.volumes[Math.min(state.v,data.volumes.length-1)]}function currentUrl(){const p=new URLSearchParams({v:state.v});if(state.intro)p.set('intro','1');else p.set('ch',state.ch);return 'construindo-reader.html?'+p.toString()}
function getMemory(){try{return JSON.parse(localStorage.getItem(READING_KEY)||'{}')||{}}catch(e){return {}}}function saveProgress(){if(!data)return;const max=Math.max(0,paper.scrollHeight-paper.clientHeight),ratio=max?Math.min(1,Math.max(0,paper.scrollTop/max)):0,v=currentVolume(),ch=v.chapters[state.ch],mem=getMemory();mem.construindo={book:'construindo',title:data.title,label:state.intro?'Volume '+v.roman+' · Abertura':'Volume '+v.roman+' · Capítulo '+ch.number+' · '+ch.title,url:currentUrl(),scrollRatio:ratio,updatedAt:Date.now()};mem.last='construindo';try{localStorage.setItem(READING_KEY,JSON.stringify(mem))}catch(e){}}
function updatePages(){const vh=Math.max(1,paper.clientHeight),total=Math.max(1,Math.ceil(paper.scrollHeight/vh)),max=Math.max(0,paper.scrollHeight-vh),ratio=max?Math.min(1,Math.max(0,paper.scrollTop/max)):0,current=total===1?1:Math.min(total,Math.floor(ratio*(total-1))+1);pageCount.textContent='Página '+current+' de '+total}
function setUrl(){history.replaceState(null,'',currentUrl())}function closeMenu(){shell.classList.remove('menu-open');document.getElementById('menuBtn').setAttribute('aria-expanded','false')}
function partHtml(ch){return ch&&ch.part?'<div class="part-banner"><strong>'+esc(ch.part)+'</strong></div>':''}
function renderSidebar(){const v=currentVolume();sideEdition.textContent=data.edition;volumeSelector.innerHTML='';data.volumes.forEach((x,i)=>{const o=document.createElement('option');o.value=i;o.textContent='Volume '+x.roman+' — '+x.title;o.selected=i===state.v;volumeSelector.appendChild(o)});chapterList.innerHTML='';const intro=document.createElement('button');intro.className='note-btn'+(state.intro?' active':'');intro.textContent='Abertura do volume';intro.onclick=()=>{state.intro=true;render();closeMenu()};chapterList.appendChild(intro);v.chapters.forEach((ch,i)=>{const b=document.createElement('button');b.className='chapter-btn'+(!state.intro&&i===state.ch?' active':'');b.innerHTML='<strong>Capítulo '+esc(ch.number)+'</strong><small>'+esc(ch.title)+'</small>';b.onclick=()=>{state.ch=i;state.intro=false;render();closeMenu()};chapterList.appendChild(b)})}
function renderContent(){const v=currentVolume();if(state.intro){paperInner.innerHTML='<div class="reader-meta"><span>'+esc(data.edition)+'</span><span>'+esc(v.version)+' · '+esc(v.pages)+' páginas</span></div><div class="book-title">'+esc(data.title)+'</div><div class="kicker">Volume '+esc(v.roman)+'</div><h2 class="editorial-title">'+esc(v.title)+'</h2><div class="content">'+blocks(v.intro)+'</div><div class="nav-bottom"><button disabled>← Anterior</button><button id="startVolume">Começar o volume →</button></div>';document.getElementById('startVolume').onclick=()=>{state.intro=false;state.ch=0;render()};progress.textContent='Volume '+v.roman+' · abertura';return}state.ch=Math.min(state.ch,v.chapters.length-1);const ch=v.chapters[state.ch];paperInner.innerHTML='<div class="reader-meta"><span>'+esc(data.edition)+'</span><span>Volume '+esc(v.roman)+' · Capítulo '+esc(ch.number)+'</span></div>'+partHtml(ch)+'<div class="book-title">'+esc(data.title)+' · Volume '+esc(v.roman)+' — '+esc(v.title)+'</div><div class="kicker">Capítulo '+esc(ch.number)+'</div><h2 class="chapter-title">'+esc(ch.title)+'</h2><div class="content">'+blocks(ch.body)+'</div><div class="nav-bottom"><button id="prevBtn">← Anterior</button><button id="nextBtn">Próximo →</button></div>';const prev=document.getElementById('prevBtn'),next=document.getElementById('nextBtn');prev.disabled=state.ch<=0;next.disabled=state.ch>=v.chapters.length-1;prev.onclick=()=>{state.ch--;render()};next.onclick=()=>{state.ch++;render()};progress.textContent='Capítulo '+(state.ch+1)+' de '+v.chapters.length}
function render(){renderSidebar();renderContent();paper.scrollTop=0;setUrl();requestAnimationFrame(()=>{updatePages();saveProgress()})}
volumeSelector.onchange=()=>{state.v=Number(volumeSelector.value);state.ch=0;state.intro=true;render()};document.getElementById('menuBtn').onclick=()=>{const open=shell.classList.toggle('menu-open');document.getElementById('menuBtn').setAttribute('aria-expanded',open?'true':'false')};document.getElementById('menuBackdrop').onclick=closeMenu;paper.addEventListener('scroll',()=>{requestAnimationFrame(updatePages);clearTimeout(saveTimer);saveTimer=setTimeout(saveProgress,180)},{passive:true});window.addEventListener('resize',()=>requestAnimationFrame(updatePages));window.addEventListener('pagehide',saveProgress);
function protect(){['copy','cut','contextmenu','selectstart','dragstart'].forEach(type=>shell.addEventListener(type,e=>{const tag=(e.target&&e.target.tagName||'').toLowerCase();if(['select','option','button','a'].includes(tag))return;e.preventDefault()},true));document.addEventListener('keydown',e=>{const key=String(e.key||'').toLowerCase(),mod=e.ctrlKey||e.metaKey;if(mod&&['c','s','p','u','a'].includes(key)){e.preventDefault();e.stopPropagation()}if(e.key==='F12'||(mod&&e.shiftKey&&['i','j','c','k'].includes(key))){e.preventDefault();e.stopPropagation()}})}protect();
if(window.LUMYRIEL_COVERS&&window.LUMYRIEL_COVERS.construindo)sideCover.style.backgroundImage='url("'+window.LUMYRIEL_COVERS.construindo+'")';
fetch(DATA_URL,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Falha ao abrir Construindo Mundos');return r.text()}).then(decodeGzipBase64).then(x=>{data=x;if(!data||data.format!=='volumes'||!Array.isArray(data.volumes)||!data.volumes.length)throw new Error('Formato de livro inesperado');state.v=Math.min(state.v,data.volumes.length-1);state.ch=Math.min(state.ch,data.volumes[state.v].chapters.length-1);if(!location.search.includes('intro=')&&!location.search.includes('ch='))state.intro=true;render()}).catch(err=>{paperInner.innerHTML='<div class="loading">Não foi possível abrir esta edição agora.</div>';console.error(err)});
</script>
