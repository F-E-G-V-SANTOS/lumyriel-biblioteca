<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teste — Biblioteca Lumyrieliana</title>
<meta name="theme-color" content="#0b0a08">
<link rel="preload" as="image" href="assets/covers/o-filho-da-montanha.webp">
<style>
:root{--bg:#0b0a08;--ink:#e8decd;--muted:#9b9285;--line:#393126;--gold:#aa8a58}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 Inter,system-ui,sans-serif}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.08;background:repeating-linear-gradient(90deg,rgba(255,255,255,.04) 0 1px,transparent 1px 5px)}
header{position:fixed;z-index:20;top:0;left:0;right:0;padding:22px 30px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(180deg,rgba(11,10,8,.9),transparent)}
.brand{font:400 .78rem Georgia,serif;letter-spacing:.18em;text-transform:uppercase}.back{color:var(--muted);font-size:.75rem}
.hero{min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding:100px 0 50px;overflow:hidden}
.hero-copy{width:min(1100px,calc(100% - 48px));margin:0 auto 48px}.eyebrow{color:var(--gold);font-size:.62rem;letter-spacing:.28em;text-transform:uppercase}.hero h1{font:400 clamp(3.1rem,7vw,7rem)/.9 Georgia,serif;letter-spacing:-.045em;margin:14px 0 16px;max-width:850px}.hero p{max-width:580px;color:var(--muted);margin:0}
.carousel-wrap{position:relative;width:100%;overflow:hidden}.carousel{display:flex;gap:34px;width:max-content;padding:25px max(24px,calc((100vw - 1100px)/2)) 45px;transition:transform .65s cubic-bezier(.2,.8,.2,1)}
.book{flex:0 0 auto;width:190px;cursor:pointer;transition:opacity .35s,transform .55s cubic-bezier(.2,.8,.2,1)}.book-cover{width:190px;aspect-ratio:2/3;object-fit:cover;display:block;border:1px solid rgba(170,138,88,.45);box-shadow:16px 22px 38px rgba(0,0,0,.45);transition:box-shadow .4s,border-color .4s}.book-name{margin-top:13px;font:400 1.05rem/1.15 Georgia,serif}.book-type{margin-top:5px;color:#746c61;font-size:.67rem;text-transform:uppercase;letter-spacing:.12em}
.book:not(.selected){opacity:.55}.book.selected{opacity:1;transform:translateY(-12px)}.book.selected .book-cover{border-color:#cfb785;box-shadow:0 28px 55px rgba(0,0,0,.6),0 0 32px rgba(170,138,88,.12)}
.book-hint{position:absolute;left:50%;bottom:3px;transform:translateX(-50%);color:#766d60;font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;white-space:nowrap}
.detail{min-height:100svh;display:grid;place-items:center;padding:100px 24px;border-top:1px solid var(--line)}
.detail-inner{width:min(900px,100%);display:grid;grid-template-columns:250px 1fr;gap:65px;align-items:center}.detail-cover{width:250px;aspect-ratio:2/3;object-fit:cover;border:1px solid rgba(170,138,88,.45);box-shadow:22px 30px 60px rgba(0,0,0,.5)}
.detail h2{font:400 clamp(2.7rem,5vw,5rem)/.95 Georgia,serif;margin:0 0 18px}.detail p{color:var(--muted);max-width:540px}.detail .meta{color:#746c61;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;margin-bottom:24px}.open{display:inline-block;margin-top:15px;border:1px solid #65543b;color:#d8c8ad;padding:11px 17px;font-size:.78rem}.open:hover{background:#18140f}
@media(max-width:700px){header{padding:18px 18px}.hero{padding-top:90px}.hero-copy{width:calc(100% - 36px);margin-bottom:30px}.hero h1{font-size:clamp(2.8rem,14vw,4.4rem)}.carousel{gap:18px;padding-inline:18px}.book{width:128px}.book-cover{width:128px}.book-name{font-size:.88rem}.book:not(.selected){opacity:.42}.book-hint{font-size:.54rem}.detail{padding:80px 20px}.detail-inner{grid-template-columns:120px 1fr;gap:24px}.detail-cover{width:120px}.detail h2{font-size:2.4rem}.detail p{font-size:.88rem}.open{font-size:.72rem}}
@media(max-width:430px){.detail-inner{grid-template-columns:1fr}.detail-cover{width:150px}.detail h2{font-size:2.7rem}}
</style>
</head>
<body>
<header><div class="brand">Lumyriel · teste</div><a class="back" href="index.html">Voltar à biblioteca</a></header>
<main>
<section class="hero" id="livros">
<div class="hero-copy"><div class="eyebrow">Uma biblioteca viva</div><h1>Escolha um livro.</h1><p>Uma experiência experimental, inspirada na simplicidade do site de referência: os livros passam horizontalmente como objetos de uma biblioteca. Escolha um deles para encontrar o seu lugar.</p></div>
<div class="carousel-wrap"><div class="carousel" id="carousel"></div><div class="book-hint">deslize para descobrir</div></div>
</section>
<div id="details"></div>
</main>
<script>
const books=[
{key:'filho',title:'O Filho da Montanha',type:'Romance',cover:'assets/covers/o-filho-da-montanha.webp',href:'reader.html?book=filho&v=0&intro=1',desc:'O romance de abertura de Lumyriel e ponto de entrada para a trajetória de Helior.'},
{key:'tempos',title:'Os Livros dos Tempos',type:'História cosmológica',cover:'assets/covers/os-livros-dos-tempos.webp',href:'reader.html?book=tempos&v=0&intro=1',desc:'A história cosmológica de Lumyriel, organizada como memória de eras, povos e acontecimentos.'},
{key:'magia',title:'Artes Mágicas Lumyrielianas',type:'Livro didático',cover:'assets/covers/artes-magicas-lumyrielianas.webp',href:'reader.html?book=magia&v=0&intro=1',desc:'O estudo das artes mágicas, seus fundamentos, limites, riscos e formas de investigação.'},
{key:'biologia',title:'Biologia Lumyrieliana',type:'Livro didático',cover:'assets/covers/biologia-lumyrieliana.webp',href:'biology-reader.html?v=0&mode=intro',desc:'Vida, anatomia, espécies, ecologia e coerência biológica do mundo.'},
{key:'matematica',title:'Matemática e Física Lumyrieliana',type:'Livro didático',cover:'assets/covers/matematica-lumyrieliana.webp',href:'reader.html?book=matematica&v=0&intro=1',desc:'Matemática e física usadas para compreender e modelar os fenômenos de Lumyriel.'},
{key:'narrar',title:'Narrar Mundos Vivos',type:'Guia',cover:'assets/covers/narrar-mundos-vivos.webp',href:'narrar-reader.html?ch=0',desc:'Um método desenvolvido a partir de Lumyriel para construir narrativas de mundos vivos.'}
];
const carousel=document.getElementById('carousel'),details=document.getElementById('details');
books.forEach((b,i)=>{
 const el=document.createElement('article');el.className='book';el.dataset.key=b.key;el.innerHTML='<img class="book-cover" src="'+b.cover+'" alt="'+b.title+'" loading="'+(i<3?'eager':'lazy')+'"><div class="book-name">'+b.title+'</div><div class="book-type">'+b.type+'</div>';
 el.addEventListener('click',()=>select(b.key));carousel.appendChild(el);
 const sec=document.createElement('section');sec.className='detail';sec.id='book-'+b.key;sec.innerHTML='<div class="detail-inner"><img class="detail-cover" src="'+b.cover+'" alt="'+b.title+'"><div><div class="meta">'+b.type+'</div><h2>'+b.title+'</h2><p>'+b.desc+'</p><a class="open" href="'+b.href+'">Abrir livro</a></div></div>';details.appendChild(sec);
});
function select(key){
 const b=books.find(x=>x.key===key);if(!b)return;
 document.querySelectorAll('.book').forEach(x=>x.classList.toggle('selected',x.dataset.key===key));
 const el=[...document.querySelectorAll('.book')].find(x=>x.dataset.key===key);
 const center=innerWidth/2-(el.offsetLeft+el.offsetWidth/2);
 carousel.style.transform='translateX('+center+'px)';
 document.getElementById('book-'+key).scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth',block:'start'});
}
select('filho');
</script>
</body>
</html>
