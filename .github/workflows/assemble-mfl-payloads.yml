name: Montar payloads MFL finais

on:
  push:
    paths:
      - 'tmp/mfl-payload/**'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Montar e validar payloads
        shell: bash
        run: |
          if [ ! -d tmp/mfl-payload ]; then
            echo 'Partes temporárias já removidas; nada a fazer.'
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, json

          expected = {
              's09': ('a564370d7ec6bb6e8d0c4b47ca3fb0e270dbe7cb4f4247f77976904338b8673d', 4, 'PARTE X — SISTEMAS QUE EVOLUEM'),
              's10': ('4a8a6e8cfc68b0615b5ec02f0492139618378fae4f8d54a954f0bf070a1e3645', 3, 'PARTE XI — LÓGICA, COMBINATÓRIA E REDES'),
              's13': ('0cca24b6629fd14d0436c3e2845a7575119d3992200fb32b3e31a2be7c7e0319', 8, 'APÊNDICES'),
          }

          root = Path('tmp/mfl-payload')
          for key, (want_sha, want_count, want_label) in expected.items():
              parts = sorted(root.glob(f'{key}.*.part'))
              if not parts:
                  raise SystemExit(f'{key}: nenhuma parte encontrada')
              data = b''.join(p.read_bytes() for p in parts)
              got_sha = hashlib.sha256(data).hexdigest()
              if got_sha != want_sha:
                  raise SystemExit(f'{key}: SHA-256 divergente: {got_sha} != {want_sha}')
              text = data.decode('utf-8-sig')
              raw = base64.b64decode(''.join(text.split()), validate=True)
              obj = json.loads(gzip.decompress(raw).decode('utf-8'))
              if obj.get('schema') != 'lumyriel-reader-math-section-v1':
                  raise SystemExit(f'{key}: schema inválido')
              if obj.get('label') != want_label:
                  raise SystemExit(f'{key}: rótulo divergente')
              if len(obj.get('chapters', [])) != want_count:
                  raise SystemExit(f'{key}: contagem divergente')
              out = Path('books') / f'lmy-mfl-{key}.dat'
              out.write_bytes(data)
              print(f'{key}: PASS — {len(data)} bytes — {want_count} leituras')
          PY

      - name: Publicar payloads e remover partes temporárias
        shell: bash
        run: |
          if [ ! -d tmp/mfl-payload ]; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add books/lmy-mfl-s09.dat books/lmy-mfl-s10.dat books/lmy-mfl-s13.dat
          git rm -r tmp/mfl-payload
          git commit -m 'Publica payloads finais RC1 de Matemática e Física'
          git pull --rebase origin main
          git push origin HEAD:main
