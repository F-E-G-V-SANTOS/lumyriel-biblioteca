name: Regenerar payloads finais RC1 MFL

on:
  push:
    paths:
      - '.github/workflows/test-mfl-source.yml'
      - 'scripts/regenerate-mfl-final.py'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Baixar RC1 congelado
        shell: bash
        run: |
          set -euo pipefail
          URL='https://docs.google.com/document/d/1-noG_PYyiyRT8xNztEp0vCgQquPXyk3S3xVG5NlNn0w/export?format=txt'
          curl -L --fail --silent --show-error "$URL" -o /tmp/mfl.txt
          test "$(wc -c < /tmp/mfl.txt)" -eq 525479

      - name: Regenerar e validar s09 s10 s13
        run: python scripts/regenerate-mfl-final.py /tmp/mfl.txt

      - name: Publicar payloads finais
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add books/lmy-mfl-s09.dat books/lmy-mfl-s10.dat books/lmy-mfl-s13.dat
          if git diff --cached --quiet; then
            echo 'Payloads finais já estão íntegros.'
            exit 0
          fi
          git commit -m 'Regenera payloads finais RC1 de Matemática e Física'
          git pull --rebase origin main
          git push origin HEAD:main
