name: Integrar RC1 de Matemática e Física ao leitor

on:
  push:
    paths:
      - '.github/workflows/integrate-mfl-reader.yml'
      - 'scripts/integrate-mfl-reader.py'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sanear marcador de truncamento e validar Base64
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          allowed = set('ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=')
          marker = '[... ELLIPSIZATION ...]'
          for p in Path('books').glob('lmy-mfl-*.dat'):
              text = p.read_text(encoding='utf-8-sig')
              markers = text.count(marker)
              if markers:
                  print(f'{p}: removendo {markers} marcador(es) de truncamento')
                  text = text.replace(marker, '')
              clean = ''.join(ch for ch in text if ch in allowed)
              bad = [ch for ch in text if ch not in allowed and not ch.isspace() and ch != '\ufeff']
              if bad:
                  raise SystemExit(f'{p}: caracteres não-Base64 inesperados: {sorted(set(map(ord,bad)))}')
              p.write_text(clean, encoding='utf-8')
          PY
      - name: Integrar e validar
        run: python scripts/integrate-mfl-reader.py
      - name: Publicar integração
        shell: bash
        run: |
          git restore books/lmy-mfl-rc1.dat books/lmy-mfl-s*.dat
          rm -f scripts/integrate-mfl-reader.py
          rm -f .github/workflows/integrate-mfl-reader.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publica Matemática e Física RC1 no leitor e catálogo'
          git push
