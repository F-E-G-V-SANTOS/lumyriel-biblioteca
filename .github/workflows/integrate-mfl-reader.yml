name: Integrar RC1 de Matemática e Física ao leitor

on:
  push:
    paths:
      - '.github/workflows/integrate-mfl-reader.yml'
      - 'scripts/integrate-mfl-reader.py'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrar e validar
        run: python scripts/integrate-mfl-reader.py
      - name: Publicar integração
        shell: bash
        run: |
          rm -f scripts/integrate-mfl-reader.py
          rm -f .github/workflows/integrate-mfl-reader.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publica Matemática e Física RC1 no leitor e catálogo'
          git push
