name: Integrar RC1 de Matemática e Física ao leitor

on:
  push:
    paths:
      - '.github/workflows/integrate-mfl-reader.yml'
      - 'scripts/integrate-mfl-reader.py'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validar payloads MFL
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, json

          allowed = set('ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=')
          marker = '[... ELLIPSIZATION ...]'

          for p in Path('books').glob('lmy-mfl-*.dat'):
              text = p.read_text(encoding='utf-8-sig')
              if marker in text:
                  raise SystemExit(f'{p}: marcador de truncamento ainda presente')
              bad = [ch for ch in text if ch not in allowed and not ch.isspace()]
              if bad:
                  raise SystemExit(f'{p}: caracteres não-Base64 inesperados')
              clean = ''.join(ch for ch in text if ch in allowed)
              try:
                  raw = base64.b64decode(clean, validate=True)
                  json.loads(gzip.decompress(raw).decode('utf-8'))
              except Exception as exc:
                  raise SystemExit(f'{p}: payload inválido: {exc}')

          print('Payloads MFL: PASS')
          PY

      - name: Integrar e validar reader/catalog
        run: python scripts/integrate-mfl-reader.py

      - name: Publicar integração
        shell: bash
        run: |
          git restore -- 'books/lmy-mfl-'*.dat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reader.html index.html
          if git diff --cached --quiet; then
            echo 'Reader e catálogo já estavam integrados.'
          else
            git commit -m 'Publica Matemática e Física RC1 no leitor e catálogo'
            git push
          fi
