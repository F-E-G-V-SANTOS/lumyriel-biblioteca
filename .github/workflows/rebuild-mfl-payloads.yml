name: Reconstruir payloads finais MFL

on:
  push:
    paths:
      - 'tmp/mfl-upload/READY'

permissions:
  contents: write

concurrency:
  group: mfl-payload-rebuild
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remontar e validar s10 e s13
        shell: bash
        run: |
          cat tmp/mfl-upload/s10.*.part > books/lmy-mfl-s10.dat
          cat tmp/mfl-upload/s13.*.part > books/lmy-mfl-s13.dat

          test "$(git hash-object books/lmy-mfl-s10.dat)" = "5de5e258a6714add844beb2959b47f3e2ab743a6"
          test "$(git hash-object books/lmy-mfl-s13.dat)" = "add33d139a7d4d3b715010c3c6ffc5db74ac34a7"

          python - <<'PY'
          from pathlib import Path
          import base64, gzip, json
          for name in ('s10','s13'):
              p=Path(f'books/lmy-mfl-{name}.dat')
              text=p.read_text(encoding='utf-8')
              raw=base64.b64decode(text, validate=True)
              obj=json.loads(gzip.decompress(raw).decode('utf-8'))
              if obj.get('schema')!='lumyriel-reader-math-section-v1':
                  raise SystemExit(f'{name}: schema inesperado')
              print(name, 'PASS', len(obj.get('chapters',[])), 'leituras')
          PY

      - name: Publicar payloads reconstruídos
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add books/lmy-mfl-s10.dat books/lmy-mfl-s13.dat
          git commit -m 'Restaura payloads finais RC1 de Matemática e Física'
          git push
