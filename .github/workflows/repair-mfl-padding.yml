name: Reparar blocos MFL por SHA

on:
  push:
    paths:
      - '.github/workflows/repair-mfl-padding.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruir s01 e s06 pelo SHA RC1
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, json

          ALPHABET='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/='

          def git_sha(text):
              blob=text.encode('utf-8')
              return hashlib.sha1(b'blob '+str(len(blob)).encode()+b'\0'+blob).hexdigest()

          def validate(text, roman, chapters):
              raw=base64.b64decode(text, validate=True)
              obj=json.loads(gzip.decompress(raw).decode('utf-8'))
              assert obj.get('schema')=='lumyriel-reader-math-section-v1'
              assert obj.get('roman')==roman, (obj.get('roman'), roman)
              assert [str(c.get('number')) for c in obj.get('chapters',[])]==chapters
              return obj

          # s01: o remoto perdeu exatamente um caractere em algum ponto.
          p=Path('books/lmy-mfl-s01.dat')
          bad=''.join(p.read_text(encoding='utf-8-sig').split())
          target='574eaa99b9db8cad336f1f8bf2289c784445111e'
          assert len(bad)==12703, len(bad)
          fixed=None
          for i in range(len(bad)+1):
              left,right=bad[:i],bad[i:]
              for ch in ALPHABET:
                  candidate=left+ch+right
                  if git_sha(candidate)==target:
                      fixed=candidate
                      print(f's01: caractere recuperado na posição {i}: {ch!r}')
                      break
              if fixed is not None:
                  break
          assert fixed is not None, 's01: nenhuma inserção produz o SHA RC1'
          assert len(fixed)==12704
          validate(fixed,'II',['4','5','6'])
          p.write_text(fixed,encoding='utf-8')
          print('s01: PASS — '+git_sha(fixed))

          # s06: o remoto ganhou exatamente um caractere em algum ponto.
          p=Path('books/lmy-mfl-s06.dat')
          bad=''.join(p.read_text(encoding='utf-8-sig').split())
          target='009397db7fc569f7b5b2e47802a5bff6ea4b5585'
          assert len(bad)==13941, len(bad)
          fixed=None
          for i in range(len(bad)):
              candidate=bad[:i]+bad[i+1:]
              if git_sha(candidate)==target:
                  fixed=candidate
                  print(f's06: caractere excedente removido na posição {i}: {bad[i]!r}')
                  break
          assert fixed is not None, 's06: nenhuma remoção produz o SHA RC1'
          assert len(fixed)==13940
          validate(fixed,'VII',['20','21','22'])
          p.write_text(fixed,encoding='utf-8')
          print('s06: PASS — '+git_sha(fixed))
          PY

      - name: Publicar blocos restaurados
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add books/lmy-mfl-s01.dat books/lmy-mfl-s06.dat
          git diff --cached --quiet && { echo 'Nada a publicar.'; exit 0; }
          git commit -m 'Restaura blocos II e VII RC1 de Matemática e Física'
          git pull --rebase origin main
          git push
