name: Reparar padding MFL

on:
  push:
    paths:
      - '.github/workflows/repair-mfl-padding.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reparar e validar s01 e s06
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, json

          specs = {
              'books/lmy-mfl-s01.dat': {
                  'length_before': 12703,
                  'length_after': 12704,
                  'sha': '574eaa99b9db8cad336f1f8bf2289c784445111e',
                  'roman': 'II',
                  'chapters': ['4','5','6'],
                  'repair': lambda s: s + '=',
              },
              'books/lmy-mfl-s06.dat': {
                  'length_before': 13941,
                  'length_after': 13940,
                  'sha': '009397db7fc569f7b5b2e47802a5bff6ea4b5585',
                  'roman': 'VII',
                  'chapters': ['20','21','22'],
                  'repair': lambda s: s[:-1],
              },
          }

          for name, spec in specs.items():
              p = Path(name)
              text = ''.join(p.read_text(encoding='utf-8-sig').split())
              assert len(text) == spec['length_before'], (name, len(text))
              fixed = spec['repair'](text)
              assert len(fixed) == spec['length_after'], (name, len(fixed))
              raw = base64.b64decode(fixed, validate=True)
              obj = json.loads(gzip.decompress(raw).decode('utf-8'))
              assert obj.get('schema') == 'lumyriel-reader-math-section-v1'
              assert obj.get('roman') == spec['roman']
              assert [str(c.get('number')) for c in obj.get('chapters', [])] == spec['chapters']
              blob = fixed.encode('utf-8')
              git_sha = hashlib.sha1(b'blob ' + str(len(blob)).encode() + b'\0' + blob).hexdigest()
              assert git_sha == spec['sha'], (name, git_sha, spec['sha'])
              p.write_text(fixed, encoding='utf-8')
              print(f'{name}: PASS — {git_sha}')
          PY
      - name: Publicar reparação
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add books/lmy-mfl-s01.dat books/lmy-mfl-s06.dat
          if git diff --cached --quiet; then
            echo 'Nada a publicar.'
            exit 0
          fi
          git commit -m 'Repara padding dos blocos II e VII de Matemática e Física'
          git push
