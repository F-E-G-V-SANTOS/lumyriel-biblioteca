<style>

*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:#eee4d2;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,select{font:inherit}a{color:inherit}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:999;opacity:.1;background:repeating-linear-gradient(96deg,rgba(255,255,255,.02) 0 1px,transparent 1px 5px)}

.topbar{height:64px;border-bottom:1px solid #41372a;background:rgba(11,10,8,.97);display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:fixed;inset:0 0 auto 0;z-index:30}.brand{display:flex;align-items:center;gap:11px;color:#e9dfcd;text-decoration:none;font:400 1rem Georgia,serif;letter-spacing:.05em}.brand:before{content:"";width:25px;height:1px;background:var(--gold)}.reader-actions{display:flex;gap:8px;align-items:center}.back,.feedback-reader,.mobile-menu{border:1px solid #4c4131;border-radius:2px;padding:8px 11px;color:#d7cdbc;text-decoration:none;font-size:.8rem;background:#15120e;cursor:pointer}.mobile-menu{display:none}
.shell{height:calc(100vh - 64px);margin-top:64px;display:grid;grid-template-columns:315px 1fr;overflow:hidden}.sidebar{border-right:1px solid #41372a;background:repeating-linear-gradient(92deg,rgba(255,255,255,.01) 0 1px,transparent 1px 5px),linear-gradient(180deg,#15120e,#0d0c0a);overflow:auto;padding:24px 20px 28px}.side-cover{width:116px;aspect-ratio:.667;margin:2px auto 20px;background:#17130f center/cover no-repeat;border:1px solid #66543d;border-radius:1px 4px 4px 1px;box-shadow:10px 12px 24px rgba(0,0,0,.4),inset 6px 0 10px rgba(0,0,0,.25)}.mini{font-size:.68rem;text-transform:uppercase;letter-spacing:.16em;color:var(--gold2);padding-top:4px}.sidebar h1{font:400 1.85rem/1.05 Georgia,serif;margin:7px 0}.edition{color:#92897d;font-size:.8rem;margin-bottom:18px;padding-bottom:15px;border-bottom:1px solid #30291f}.selector{margin:12px 0;padding-bottom:12px;border-bottom:1px solid #30291f}.selector label{display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:#958b7c;margin-bottom:6px}.selector select{width:100%;border:0;border-bottom:1px solid #594936;border-radius:0;padding:9px 2px;background:#15120e;color:#ddd2bf}.chapter-list{display:grid;margin-top:14px;border-top:1px solid #30291f}.chapter-btn,.note-btn{width:100%;text-align:left;border:0;border-bottom:1px solid #2c261e;background:transparent;color:#9f9689;padding:10px 4px;cursor:pointer;line-height:1.3}.chapter-btn:hover,.note-btn:hover{color:#e8dcc8}.chapter-btn.active,.note-btn.active{color:#efe3cf;box-shadow:inset 2px 0 0 #9a7c4e;padding-left:11px}.chapter-btn strong{font-family:Georgia,"Times New Roman",serif;font-weight:400}.chapter-btn small{display:block;color:#7e756a;font-size:.72rem;margin-top:4px}
.paper-wrap{position:relative;background:#17130f;overflow:hidden}.paper{height:100%;overflow:auto;background:radial-gradient(circle at 16% 8%,rgba(120,91,54,.055),transparent 18%),radial-gradient(circle at 82% 76%,rgba(120,91,54,.035),transparent 22%),repeating-linear-gradient(96deg,rgba(72,55,33,.02) 0 1px,transparent 1px 5px),linear-gradient(90deg,#ccb78f,#eadfc8 6%,#eadfc8 94%,#c9b189);color:var(--ink);padding:52px clamp(24px,7vw,110px) 94px;scroll-behavior:smooth;box-shadow:inset 14px 0 30px rgba(69,51,30,.16),inset -14px 0 30px rgba(69,51,30,.12)}.paper-inner{max-width:780px;margin:0 auto}.paper-inner:before{content:"";display:block;width:42px;height:1px;background:rgba(91,69,43,.35);margin:0 0 30px}.reader-meta{display:flex;justify-content:space-between;gap:16px;align-items:center;color:#776a58;font-size:.78rem;margin-bottom:34px;padding-bottom:12px;border-bottom:1px solid rgba(82,64,42,.2)}.kicker{text-transform:uppercase;letter-spacing:.17em;font-size:.69rem;color:#8a6b40;margin-bottom:10px}.chapter-title,.editorial-title{font:400 clamp(2.2rem,5vw,4rem)/1.04 Georgia,serif;margin:0 0 36px;color:#2e261c}.book-title{font:400 1.05rem Georgia,serif;color:#675846;margin-bottom:8px}.content p{font:1.09rem/1.87 Georgia,"Times New Roman",serif;margin:0 0 1.2em}.content h3{font:400 1.42rem/1.28 Georgia,"Times New Roman",serif;color:#493b29;margin:2.1em 0 .72em}.content h3:first-child{margin-top:0}.part-banner{margin:0 0 34px;padding:16px 0 18px;border-top:1px solid rgba(90,67,39,.25);border-bottom:1px solid rgba(90,67,39,.25);color:#62513b}.part-banner strong{display:block;font:400 1.15rem/1.3 Georgia,serif;color:#4a3a27}.part-banner p{margin:9px 0 0;font:italic .93rem/1.65 Georgia,serif;color:#74644f}.nav-bottom{display:flex;justify-content:space-between;gap:12px;margin-top:54px;padding-top:24px;border-top:1px solid rgba(76,61,42,.28)}.nav-bottom button{border:0;border-bottom:1px solid rgba(84,68,46,.42);background:transparent;color:#4e4232;padding:10px 2px;cursor:pointer}.nav-bottom button:disabled{opacity:.35;cursor:not-allowed}.page-count,.progress{position:absolute;bottom:16px;z-index:8;color:#7a6c58;font:500 .71rem/1 Georgia,"Times New Roman",serif;pointer-events:none}.page-count{right:18px}.progress{left:18px}.loading{min-height:60vh;display:grid;place-items:center;color:#756957;font:italic 1.15rem Georgia,serif}.menu-backdrop{display:none;border:0;padding:0}.nojs{margin:82px auto 20px;width:min(760px,calc(100% - 32px));padding:18px 0;color:#b8ad9c}
.shell,.shell *,.paper,.paper *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-user-drag:none}.shell select,.shell option,.shell button,.shell a{-webkit-user-select:auto;user-select:auto}::selection{background:transparent;color:inherit}
@media(max-width:850px){.topbar{height:58px;padding:0 8px 0 10px;gap:6px}.brand{font-size:.88rem;min-width:0}.reader-actions{gap:5px}.feedback-reader[data-support-project],#readerFeedbackLink{display:none}.mobile-menu{display:inline-flex;min-height:40px;border-radius:999px}.back{width:40px;height:40px;font-size:0;border-radius:999px;display:grid;place-items:center}.back:before{content:'←';font-size:1rem}.shell{height:calc(100vh - 58px);margin-top:58px;display:block}.sidebar{position:fixed;z-index:25;top:58px;bottom:0;left:0;width:min(88vw,330px);transform:translateX(-102%);transition:.22s;box-shadow:18px 0 45px rgba(0,0,0,.45)}.menu-backdrop{position:fixed;z-index:24;inset:58px 0 0;background:rgba(0,0,0,.56)}.shell.menu-open .sidebar{transform:translateX(0)}.shell.menu-open .menu-backdrop{display:block}.paper-wrap{height:100%}.paper{padding:34px 20px 92px}.chapter-title,.editorial-title{font-size:2.4rem}.content p{font-size:1.04rem;line-height:1.76}.progress{max-width:60%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}}
@media(prefers-reduced-motion:reduce){.paper{scroll-behavior:auto}.sidebar{transition:none!important}}@media print{body>*{display:none!important}body:after{content:"A edição de leitura está disponível somente na Biblioteca Lumyrieliana.";display:block!important;padding:48px;font:18px/1.6 Georgia,serif;color:#111;background:#fff}}

<body>
<a class="skip-link" href="#paper">Pular para a leitura</a>
<header class="topbar"><a class="brand" href="index.html"><span>Biblioteca Lumyrieliana</span></a><div class="reader-actions"><a id="readerFeedbackLink" class="feedback-reader" href="feedback.html?book=biologia">Feedback</a><button type="button" class="feedback-reader" data-support-project>Apoie</button><button id="menuBtn" class="mobile-menu" type="button" aria-controls="sidebar" aria-expanded="false">Capítulos</button><a class="back" href="index.html" aria-label="Voltar à Biblioteca">← Biblioteca</a></div></header>
<noscript><div class="nojs">Este leitor precisa de JavaScript para abrir os volumes e preservar a navegação.</div></noscript>
<div class="shell" id="shell"><button class="menu-backdrop" id="menuBackdrop" type="button" aria-label="Fechar lista de capítulos"></button><aside class="sidebar" id="sidebar"><div class="side-cover" id="sideCover" aria-hidden="true"></div><div class="mini">Obra didática · Primeira Edição</div><h1 id="sideTitle">Biologia de Lumyriel</h1><div class="edition" id="sideEdition">RC1 · Primeira Edição</div><div class="selector"><label for="bookSelector">Livros disponíveis</label><select id="bookSelector"><option value="biologia">Biologia de Lumyriel</option><option value="filho">O Filho da Montanha</option><option value="tempos">Os Livros dos Tempos</option><option value="magia">Artes Mágicas Lumyrielianas</option><option value="matematica">Matemática e Física de Lumyriel</option></select></div><div class="selector"><label for="volumeSelector">Volume</label><select id="volumeSelector"></select></div><div id="chapterList" class="chapter-list"></div></aside><main class="paper-wrap"><article class="paper" id="paper"><div class="paper-inner" id="paperInner"><div class="loading" role="status">Abrindo Biologia de Lumyriel…</div></div></article><div class="progress" id="progress">Carregando…</div><div class="page-count" id="pageCount">Página 1 de 1</div></main></div>
<script src="assets/covers-data.js"></script><script src="assets/site-config.js"></script><script src="assets/support-widget.js"></script>
<script>
const DATA='books/lmy-bio-rc1.dat',READING_KEY='lumyriel-reading-progress-v1';
const q=new URLSearchParams(location.search);let data=null;let state={v:Math.max(0,Number(q.get('v')||0)),ch:Math.max(0,Number(q.get('ch')||0)),mode:q.get('mode')||'intro'};
const shell=document.getElementById('shell'),paper=document.getElementById('paper'),paperInner=document.getElementById('paperInner'),chapterList=document.getElementById('chapterList'),volumeSelector=document.getElementById('volumeSelector'),pageCount=document.getElementById('pageCount'),progress=document.getElementById('progress');
if(window.LUMYRIEL_COVERS&&window.LUMYRIEL_COVERS.biologia)document.getElementById('sideCover').style.backgroundImage='url("'+window.LUMYRIEL_COVERS.biologia+'")';
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function blocks(text){return String(text||'').split(/\n{2,}/).map(x=>x.trim()).filter(Boolean).map(x=>x.startsWith('## ')?'<h3>'+esc(x.slice(3))+'</h3>':'<p>'+esc(x).replace(/\n/g,'<br>')+'</p>').join('')}
async function loadData(){const response=await fetch(DATA,{cache:'no-store'});if(!response.ok)throw new Error('Falha ao abrir a edição');const encoded=(await response.text()).replace(/\s+/g,''),binary=atob(encoded),bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);if(typeof DecompressionStream!=='function')throw new Error('Navegador sem suporte à leitura desta edição');const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));return JSON.parse(await new Response(stream).text())}
function getMemory(){try{return JSON.parse(localStorage.getItem(READING_KEY)||'{}')||{}}catch(e){return {}}}
function currentUrl(){const p=new URLSearchParams({v:String(state.v),mode:state.mode});if(state.mode==='chapter')p.set('ch',String(state.ch));return 'biology-reader.html?'+p.toString()}
function currentLabel(){const v=data&&data.volumes[state.v];if(!v)return '';if(state.mode==='intro')return 'Volume '+v.roman+' · '+v.introTitle;if(state.mode==='refs')return 'Volume '+v.roman+' · Referências';if(state.mode==='map')return 'Volume '+v.roman+' · Mapa de continuidade';const ch=v.chapters[state.ch];return ch?'Volume '+v.roman+' · Capítulo '+ch.number+' · '+ch.title:''}
function save(){if(!data)return;const max=Math.max(0,paper.scrollHeight-paper.clientHeight),mem=getMemory();mem.biologia={book:'biologia',title:data.title,label:currentLabel(),url:currentUrl(),scrollRatio:max?paper.scrollTop/max:0,updatedAt:Date.now()};mem.last='biologia';try{localStorage.setItem(READING_KEY,JSON.stringify(mem))}catch(e){}}
function setUrl(){history.replaceState(null,'',currentUrl())}
function closeMenu(){shell.classList.remove('menu-open');document.getElementById('menuBtn').setAttribute('aria-expanded','false')}
function buildEntries(){const out=[];data.volumes.forEach((v,vi)=>{out.push({v:vi,mode:'intro'});v.chapters.forEach((ch,ci)=>out.push({v:vi,mode:'chapter',ch:ci}));out.push({v:vi,mode:'refs'});out.push({v:vi,mode:'map'})});return out}
function currentFlatIndex(entries){return entries.findIndex(e=>e.v===state.v&&e.mode===state.mode&&(e.mode!=='chapter'||e.ch===state.ch))}
function openEntry(entry){state.v=entry.v;state.mode=entry.mode;if(entry.mode==='chapter')state.ch=entry.ch||0;render();}
function goRelative(delta){const entries=buildEntries(),index=currentFlatIndex(entries),next=entries[index+delta];if(next)openEntry(next)}
function renderSidebar(){const v=data.volumes[state.v]||data.volumes[0];document.getElementById('sideTitle').textContent=data.title;document.getElementById('sideEdition').textContent=data.edition;volumeSelector.innerHTML='';data.volumes.forEach((item,i)=>{const option=document.createElement('option');option.value=i;option.textContent='Volume '+item.roman+' — '+item.title;option.selected=i===state.v;volumeSelector.appendChild(option)});chapterList.innerHTML='';const intro=document.createElement('button');intro.className='note-btn'+(state.mode==='intro'?' active':'');intro.textContent=v.introTitle||'Abertura do volume';intro.onclick=()=>{state.mode='intro';render();closeMenu()};chapterList.appendChild(intro);v.chapters.forEach((ch,i)=>{const button=document.createElement('button');button.className='chapter-btn'+(state.mode==='chapter'&&state.ch===i?' active':'');button.innerHTML='<strong>Capítulo '+esc(ch.number)+'</strong><small>'+esc(ch.title)+'</small>';button.onclick=()=>{state.mode='chapter';state.ch=i;render();closeMenu()};chapterList.appendChild(button)});const refs=document.createElement('button');refs.className='note-btn'+(state.mode==='refs'?' active':'');refs.textContent='Referências e notas de fronteira';refs.onclick=()=>{state.mode='refs';render();closeMenu()};chapterList.appendChild(refs);const map=document.createElement('button');map.className='note-btn'+(state.mode==='map'?' active':'');map.textContent='Mapa de continuidade da coleção';map.onclick=()=>{state.mode='map';render();closeMenu()};chapterList.appendChild(map)}
function navHtml(){const entries=buildEntries(),index=currentFlatIndex(entries);return '<div class="nav-bottom"><button id="prevBtn" '+(index<=0?'disabled':'')+'>← Anterior</button><button id="nextBtn" '+(index>=entries.length-1?'disabled':'')+'>Próximo →</button></div>'}
function renderContent(){const v=data.volumes[state.v];let html='';if(state.mode==='intro'){html='<div class="reader-meta"><span>'+esc(data.edition)+'</span><span>Volume '+esc(v.roman)+' · '+esc(v.pages)+' páginas</span></div><div class="book-title">Biologia de Lumyriel</div><div class="kicker">Volume '+esc(v.roman)+'</div><h2 class="editorial-title">'+esc(v.title)+'</h2><div class="content">'+blocks(v.intro)+'</div>'+navHtml();progress.textContent='Volume '+v.roman+' · abertura'}else if(state.mode==='refs'){html='<div class="reader-meta"><span>'+esc(data.edition)+'</span><span>Volume '+esc(v.roman)+'</span></div><div class="book-title">'+esc(v.title)+'</div><div class="kicker">Aparato editorial</div><h2 class="editorial-title">Referências e notas de fronteira</h2><div class="content">'+blocks(v.references)+'</div>'+navHtml();progress.textContent='Volume '+v.roman+' · referências'}else if(state.mode==='map'){html='<div class="reader-meta"><span>'+esc(data.edition)+'</span><span>Volume '+esc(v.roman)+'</span></div><div class="book-title">'+esc(v.title)+'</div><div class="kicker">Continuidade</div><h2 class="editorial-title">Mapa de continuidade da coleção</h2><div class="content">'+blocks(v.continuity)+'</div>'+navHtml();progress.textContent='Volume '+v.roman+' · continuidade'}else{state.ch=Math.min(state.ch,v.chapters.length-1);const ch=v.chapters[state.ch];html='<div class="reader-meta"><span>'+esc(data.edition)+'</span><span>Volume '+esc(v.roman)+' · Capítulo '+esc(ch.number)+' de '+v.chapters.length+'</span></div>'+(ch.part?'<div class="part-banner"><strong>'+esc(ch.part)+'</strong>'+(ch.partIntro?'<p>'+esc(ch.partIntro).replace(/\n\n/g,'</p><p>').replace(/^##\s*/,'')+'</p>':'')+'</div>':'')+'<div class="book-title">Volume '+esc(v.roman)+' — '+esc(v.title)+'</div><div class="kicker">Capítulo '+esc(ch.number)+'</div><h2 class="chapter-title">'+esc(ch.title)+'</h2><div class="content">'+blocks(ch.body)+'</div>'+navHtml();progress.textContent='Volume '+v.roman+' · capítulo '+(state.ch+1)+' de '+v.chapters.length}paperInner.innerHTML=html;const prev=document.getElementById('prevBtn'),next=document.getElementById('nextBtn');if(prev)prev.onclick=()=>goRelative(-1);if(next)next.onclick=()=>goRelative(1)}
function updatePages(){const vh=Math.max(1,paper.clientHeight),total=Math.max(1,Math.ceil(paper.scrollHeight/vh)),max=Math.max(0,paper.scrollHeight-vh),ratio=max?Math.min(1,Math.max(0,paper.scrollTop/max)):0,current=total===1?1:Math.min(total,Math.floor(ratio*(total-1))+1);pageCount.textContent='Página '+current+' de '+total}
function render(){state.v=Math.min(state.v,data.volumes.length-1);renderSidebar();renderContent();paper.scrollTop=0;setUrl();requestAnimationFrame(()=>{updatePages();save()})}
volumeSelector.onchange=()=>{state.v=Number(volumeSelector.value);state.ch=0;state.mode='intro';render()};document.getElementById('bookSelector').onchange=e=>{const id=e.target.value;if(id==='biologia')return;const routes={filho:'reader.html?book=filho&ch=0',tempos:'reader.html?book=tempos&note=1',magia:'reader.html?book=magia&v=0&intro=1',matematica:'reader.html?book=matematica&intro=1'};location.href=routes[id]};document.getElementById('menuBtn').onclick=()=>{const open=shell.classList.toggle('menu-open');document.getElementById('menuBtn').setAttribute('aria-expanded',String(open))};document.getElementById('menuBackdrop').onclick=closeMenu;
paper.addEventListener('scroll',()=>{requestAnimationFrame(updatePages);save()},{passive:true});window.addEventListener('resize',()=>requestAnimationFrame(updatePages));window.addEventListener('pagehide',save);
['copy','cut','contextmenu','selectstart','dragstart'].forEach(type=>shell.addEventListener(type,e=>{const tag=(e.target&&e.target.tagName||'').toLowerCase();if(['select','option','button','a'].includes(tag))return;e.preventDefault()},true));document.addEventListener('keydown',e=>{const key=String(e.key||'').toLowerCase(),mod=e.ctrlKey||e.metaKey;if(mod&&['c','s','p','u','a'].includes(key)){e.preventDefault();e.stopPropagation()}if(e.key==='F12'||(mod&&e.shiftKey&&['i','j','c','k'].includes(key))){e.preventDefault();e.stopPropagation()}if(e.key==='ArrowLeft'&&e.altKey)goRelative(-1);if(e.key==='ArrowRight'&&e.altKey)goRelative(1);if(e.key==='Escape')closeMenu()},true);
loadData().then(book=>{data=book;state.v=Math.min(state.v,data.volumes.length-1);state.ch=Math.min(state.ch,data.volumes[state.v].chapters.length-1);render()}).catch(error=>{paperInner.innerHTML='<div class="loading">Não foi possível abrir esta edição agora.</div>';console.error(error)});
</script>
</body></html>
